<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gray Matter — Control Center</title>
<style>
  /* tokyo-night, the same palette as Neuron's old control center */
  :root{
    --bg:#1a1b26; --panel:#1f2335; --panel2:#24283b; --line:#2f3450;
    --fg:#c0caf5; --dim:#7f88b0; --accent:#7aa2f7; --ok:#9ece6a;
    --warn:#e0af68; --err:#f7768e;
    --c-gm:#7dcfff; --c-neuron:#7aa2f7; --c-neurag:#bb9af7;
    --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;
       background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
  button{font:inherit}

  /* --- header: one row, tool status included --- */
  header{display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
  /* Served by the local http server (see _build_server): the page is not a
     file:// document, so a relative path to assets/ would 404. */
  header .logo{height:26px;width:auto;display:block;flex:0 0 auto}
  header .sub{color:var(--dim);font-size:12px}
  header .spacer{flex:1}
  #lang-select{width:auto;background:var(--bg);border:1px solid var(--line);border-radius:4px;
               color:var(--dim);padding:2px 6px;font-size:11px;cursor:pointer}
  #lang-select:focus{outline:none;border-color:var(--accent)}

  /* --- health pills (in the header) --- */
  .health-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--dim)}
  .health-item{display:flex;align-items:center;gap:5px;padding:2px 4px 2px 8px;border-radius:12px;
               background:var(--bg);border:1px solid var(--line)}
  .health-item .dot{width:7px;height:7px;border-radius:50%;margin:0}
  .health-item .val{color:var(--fg);font-family:var(--mono);font-size:11px}
  .health-item.running .dot{background:var(--ok)}
  .health-item.stopped .dot,.health-item.unknown .dot{background:var(--dim)}
  .health-item.error .dot{background:var(--err)}
  .hb{width:20px;height:20px;border:none;border-radius:50%;cursor:pointer;font-size:10px;line-height:1;
      display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--dim)}
  .hb:hover{background:var(--accent);color:var(--bg)}
  .running .hb{color:var(--err)} .stopped .hb,.unknown .hb{color:var(--ok)}
  .stop-all{padding:2px 10px;border:1px solid var(--err);border-radius:12px;background:transparent;
            color:var(--err);cursor:pointer;font-size:11px}
  .stop-all:hover{background:var(--err);color:var(--bg)}

  main{flex:1;display:flex;min-height:0}

  /* --- sidebar: the sections --- */
  nav{width:236px;flex-shrink:0;border-right:1px solid var(--line);
      background:var(--panel);overflow-y:auto;padding:10px 0;display:flex;flex-direction:column}
  nav h2{margin:12px 14px 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
         color:var(--dim);font-weight:600}
  .nv{display:grid;grid-template-columns:22px 1fr;column-gap:6px;width:100%;text-align:left;
      background:none;border:0;cursor:pointer;color:var(--fg);padding:7px 14px;
      border-left:3px solid transparent}
  .nv:hover{background:var(--panel2)}
  .nv[aria-current="true"]{background:var(--panel2);border-left-color:var(--accent)}
  .nv .ic{color:var(--dim);text-align:center;grid-row:span 2}
  .nv[aria-current="true"] .ic{color:var(--accent)}
  .nv .name{font-weight:600;font-size:13px}
  .nv .meta{font-size:11px;color:var(--dim);line-height:1.3}
  #cmd-filter{margin:10px 14px 0;width:auto;padding:5px 9px;border-radius:7px}

  /* --- body --- */
  section{flex:1;overflow-y:auto;padding:16px 22px;min-width:0}
  .intro{color:var(--dim);font-size:13px;margin:0 0 14px;max-width:900px}
  .intro b{color:var(--fg)}
  .grp{margin-bottom:16px}
  /* Group title = a toggle: the state lives in localStorage, so what you put
     away stays put away. */
  .grp > h3{margin:0 0 9px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
          color:var(--dim);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:5px;
          cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
  .grp > h3:hover{color:var(--fg)}
  .grp > h3::before{content:"\25BE";font-size:9px;transition:transform .12s;opacity:.7}
  .grp.collapsed > h3::before{transform:rotate(-90deg)}
  .grp.collapsed > h3{margin-bottom:0}
  .grp.collapsed > *:not(h3){display:none}
  .grp > h3 .tsub{text-transform:none;letter-spacing:0;font-weight:400;font-size:12px}
  .grp > h3 .tver{text-transform:none;letter-spacing:0;font-family:var(--mono);font-size:11px;margin-left:auto}
  .tdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .sub-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}

  /* one command per row: name on the left, what it does beside it */
  .cmds{display:flex;flex-direction:column;gap:6px}
  .cmd{background:var(--panel);border:1px solid var(--line);border-radius:8px;
       padding:8px 12px;cursor:pointer;transition:border-color .12s;
       display:grid;grid-template-columns:170px 1fr;column-gap:12px;align-items:baseline}
  .cmd:hover{border-color:var(--accent)}
  .cmd[aria-expanded="true"]{border-color:var(--accent);cursor:default}
  .cmd .n{font-family:var(--mono);font-size:13px;color:var(--accent);cursor:pointer}
  .cmd .h{font-size:12.5px;color:var(--fg);opacity:.85}
  .cmd .when,.cmd .form,.cmd .syn{grid-column:1/-1}
  .badge{font-size:10px;letter-spacing:.04em;border:1px solid var(--line);border-radius:10px;
         padding:0 7px;margin-left:6px;color:var(--dim);white-space:nowrap;font-family:var(--sans)}
  .badge.ask{color:var(--warn);border-color:var(--warn)}
  @media (max-width:700px){.cmd{grid-template-columns:1fr}}
  /* "When to use it": a side bar sets it apart from the description, since it
     answers a different question ("is this the one I need right now?"). */
  .cmd .when{font-size:12.5px;color:var(--dim);margin-top:7px;padding-left:9px;
             border-left:2px solid var(--line);line-height:1.45}
  .cmd .when-k{color:var(--accent);font-weight:600}
  .form{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:10px}
  .row{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:start}
  .row label{font-size:12px;color:var(--fg);font-family:var(--mono);overflow-wrap:anywhere;padding-top:6px}
  .row .req{color:var(--err)}
  .row .doc{font-size:12px;color:var(--dim);margin-top:3px}
  .row .doc code{font-family:var(--mono);font-size:11px}
  input,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;
               color:var(--fg);padding:6px 9px;font:13px var(--mono);width:100%}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  input[type=checkbox]{width:auto;margin:7px 0 0}
  .knobs{display:grid;gap:12px}
  .pill{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);
        border:1px solid var(--warn);border-radius:10px;padding:1px 7px;vertical-align:middle;font-family:var(--sans)}
  .kstat{margin-left:6px}
  /* the exact command the GUI will run, copyable into a terminal */
  .cline{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);
         border-radius:6px;padding:6px 6px 6px 10px;font:12.5px var(--mono);color:var(--ok);overflow-x:auto}
  .cline .pr{color:var(--dim);user-select:none}
  .cline code{flex:1;white-space:pre}
  .cline button,.ghost{background:none;border:1px solid var(--line);border-radius:6px;color:var(--dim);
         padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
  .cline button:hover,.ghost:hover{color:var(--fg);border-color:var(--accent)}
  .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .go{justify-self:start;background:var(--accent);color:var(--bg);border:0;border-radius:6px;
      padding:7px 18px;font-weight:600;cursor:pointer;font-size:13px}
  .go:hover{filter:brightness(1.1)}
  .go:disabled{opacity:.5;cursor:default}
  .go.small{padding:3px 10px;font-size:11px}
  .go.danger{background:var(--err)}
  .hint{font-size:12px;color:var(--dim)}
  details{border:1px dashed var(--line);border-radius:6px;padding:6px 10px}
  details[open]{display:grid;gap:8px}
  summary{cursor:pointer;user-select:none}
  summary:hover{color:var(--fg)}
  .empty{color:var(--dim);font-size:13px;padding:22px 0}

  /* --- legend and glossary --- */
  .legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 18px;font-size:12.5px}
  .legend div{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:baseline}
  .legend .sym{font-family:var(--mono);color:var(--accent);text-align:right}
  .legend .sym.w{font-family:var(--sans);font-weight:600;color:var(--fg)}

  /* --- cards (overview, connections) --- */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .card h4{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
  .card h4 .sp{flex:1}
  .infra-row{display:flex;align-items:center;gap:8px;padding:2px 0;font-size:12px;flex-wrap:wrap}
  .infra-row .label{color:var(--dim);min-width:96px}
  .infra-row .value{color:var(--fg);font-family:var(--mono);word-break:break-all}
  .infra-row .value.ok{color:var(--ok)} .infra-row .value.warn{color:var(--warn)}
  .infra-row .value.err{color:var(--err)}
  .infra-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.04em}
  .infra-tag.on{background:rgba(158,206,106,.15);color:var(--ok)}
  .infra-tag.off{background:rgba(127,136,176,.15);color:var(--dim)}

  /* --- MCP clients --- */
  .clients-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .client-item{display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:6px;
               border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:13px}
  .client-item input{margin:0}
  .client-item.absent{opacity:.55}
  .client-item.bad{border-color:var(--warn)}
  .client-item .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .client-item .dot.on{background:var(--ok)}
  .client-item .dot.warn{background:var(--warn)}
  .client-problems{margin:6px 0 8px;padding:7px 10px;border-left:3px solid var(--warn);
                   background:var(--bg);border-radius:4px;font-size:12px;color:var(--dim)}
  .client-problems b{color:var(--warn)}
  .client-problems div{margin:2px 0;font-family:var(--mono)}

  /* --- bridges table --- */
  table.bt{width:100%;border-collapse:collapse;font-size:12.5px}
  .bt th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.06em;
         text-transform:uppercase;border-bottom:1px solid var(--line);padding:6px 8px}
  .bt td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
  .bt td.m{font-family:var(--mono)}
  .bt td.n{white-space:nowrap;text-align:right;font-family:var(--mono)}
  .bt td.a{white-space:nowrap;text-align:right}
  .bt input{padding:3px 6px;font-size:12px}
  .bt tr:hover td{background:var(--panel)}
  .bform{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:8px;align-items:end}
  .bform label{font-size:11px;color:var(--dim);display:block;margin-bottom:3px}
  @media (max-width:800px){.bform{grid-template-columns:1fr}}

  /* --- migration banner --- */
  .migration-banner{display:none;padding:8px 16px;border-bottom:1px solid var(--warn);
                    background:var(--panel2);font-size:13px;color:var(--fg)}
  .migration-banner.show{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .migration-banner .icon{color:var(--warn);font-size:16px}
  .migration-banner .msg{flex:1;min-width:200px}
  .migration-banner .msg b{color:var(--warn)}
  .migration-banner .tool-list{display:flex;gap:6px;flex-wrap:wrap}
  .migration-banner .tool-pill{display:flex;align-items:center;gap:5px;padding:3px 8px;
                               border-radius:6px;background:var(--panel);border:1px solid var(--line);font-size:12px}
  .migration-banner .tool-pill .path{color:var(--dim);font-family:var(--mono);font-size:11px}
  .migration-banner button{background:var(--warn);color:var(--bg);border:0;border-radius:6px;
                           padding:5px 14px;font-weight:600;cursor:pointer;font-size:12px}
  .migration-banner .dismiss{background:none;border:1px solid var(--line);color:var(--dim)}

  /* --- Graphs view: Neuron, NeuRAG and the bridges between them --- */
  .graphs{display:flex;flex-direction:column;gap:8px;height:100%;min-height:460px}
  .gbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:var(--dim)}
  .gbar label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .gbar input[type=checkbox]{width:auto;margin:0}
  .gbar input[type=search]{width:220px}
  .gbar button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--dim);
               padding:4px 11px;font-size:12px;cursor:pointer}
  .gbar button:hover{color:var(--fg);border-color:var(--accent)}
  .gsw{display:inline-block;width:9px;height:9px;border-radius:50%}
  .gwrap{flex:1;display:flex;gap:10px;min-height:0}
  #gnet{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px}
  #gside{width:310px;flex-shrink:0;overflow-y:auto;background:var(--panel);border:1px solid var(--line);
         border-radius:8px;padding:10px 12px;font-size:12px}
  #gside h4{margin:0 0 4px;font-size:14px;color:var(--fg);word-break:break-word}
  #gside .gk{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-top:10px}
  .gfact{border-left:2px solid var(--line);padding:2px 8px;margin:6px 0;word-break:break-word}
  .gfact .gk{margin:0}

  /* --- graph tools --- */
  .gbtn{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--dim);
        padding:4px 11px;font-size:12px;cursor:pointer;transition:all .15s}
  .gbtn:hover,.gbtn.on{color:var(--fg);border-color:var(--accent)}
  .gbtn.on{background:rgba(122,162,247,.15)}
  .gphys{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-size:12px;color:var(--dim);
         background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  .gphys[hidden],.gbanner[hidden]{display:none}
  .gphys label{display:flex;align-items:center;gap:7px}
  .gphys input[type=range]{width:110px;padding:0;accent-color:var(--accent)}
  .gphys input[type=checkbox]{margin:0}
  .gval{font-family:var(--mono);color:var(--fg);min-width:26px}
  .gbanner{background:rgba(158,206,106,.12);border:1px solid var(--ok);border-radius:8px;
           padding:6px 12px;font-size:12.5px;display:flex;align-items:center;gap:8px}
  #gside input{margin:2px 0 6px}
  /* --- toasts --- */
  #toasts{position:fixed;right:18px;bottom:60px;display:flex;flex-direction:column;gap:8px;z-index:50}
  .toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);
         border-radius:8px;padding:8px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.35);
         animation:tin .18s ease-out;transition:opacity .4s,transform .4s;max-width:380px}
  .toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--err)} .toast.warn{border-left-color:var(--warn)}
  .toast.out{opacity:0;transform:translateX(20px)}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* --- a lighter, more modern feel --- */
  .nv{transition:background .15s,border-color .15s}
  .cmd{transition:border-color .15s,box-shadow .15s,transform .15s}
  .cmd:not([aria-expanded="true"]):hover{transform:translateX(2px);box-shadow:0 2px 12px rgba(0,0,0,.25)}
  .cmd[aria-expanded="true"]{box-shadow:0 4px 22px rgba(0,0,0,.3)}
  .card{transition:border-color .15s;box-shadow:0 1px 0 rgba(255,255,255,.02) inset}
  .card:hover{border-color:#3b4261}
  .go{transition:filter .15s,transform .1s} .go:active{transform:scale(.97)}
  section::-webkit-scrollbar,nav::-webkit-scrollbar,pre::-webkit-scrollbar,#gside::-webkit-scrollbar{width:9px}
  section::-webkit-scrollbar-thumb,nav::-webkit-scrollbar-thumb,pre::-webkit-scrollbar-thumb,#gside::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

  /* --- console --- */
  footer{height:220px;flex-shrink:0;border-top:1px solid var(--line);
         background:var(--panel2);display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid var(--line)}
  .bar .t{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .bar .spacer{flex:1}
  .bar button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--dim);
              padding:3px 11px;font-size:12px;cursor:pointer}
  .bar button:hover{color:var(--fg);border-color:var(--accent)}
  .run{font-size:11px;color:var(--warn);font-family:var(--mono)}
  pre{flex:1;margin:0;overflow-y:auto;padding:9px 12px;font:12px/1.55 var(--mono);
      white-space:pre-wrap;word-break:break-word}
  .l-cmd{color:var(--accent)} .l-ok{color:var(--ok)} .l-warn{color:var(--warn)}
  .l-err{color:var(--err)}
  /* Reply row under the console: shown only while a command runs. */
  #stdin-bar{border-top:1px solid var(--line);gap:8px}
  #stdin-bar[hidden]{display:none}
  #stdin-input{flex:1;font:13px var(--mono)}
  #btn-send{white-space:nowrap}
  /* The footer height is FIXED: hiding #log alone left a band of the same
     height behind, so "collapse the console" collapsed nothing. The line
     below is what actually collapses it. */
  footer.collapsed{height:auto}
  footer.collapsed #log{display:none}
  footer.collapsed #stdin-bar{display:none}
  #btn-console-toggle{min-width:26px}
</style>
</head>
<body>

<header>
  <img class="logo" src="__GM_API_BASE__/logo.png" alt="Gray Matter"
       onerror="this.style.display='none'">
  <h1>Gray Matter</h1>
  <span class="sub" id="hdr-sub">Control Center</span>
  <span class="spacer"></span>
  <div class="health-bar" id="health-bar"></div>
  <select id="lang-select" title="Language / Lingua">
    <option value="it">IT</option>
    <option value="en">EN</option>
  </select>
</header>

<div class="migration-banner" id="migration-banner">
  <span class="icon">&#9888;</span>
  <span class="msg" id="migration-msg"></span>
  <div class="tool-list" id="migration-tools"></div>
  <button id="btn-migrate-all"></button>
  <button id="btn-migrate-dismiss" class="dismiss"></button>
</div>

<main>
  <nav>
    <div id="views"></div>
    <input id="cmd-filter" type="search" autocomplete="off">
  </nav>
  <section id="body"><div class="empty" id="loading-msg"></div></section>
</main>

<footer>
  <div class="bar">
    <button id="btn-console-toggle" title=""></button>
    <span class="t" id="console-title"></span>
    <span class="run" id="running"></span>
    <span class="spacer"></span>
    <button id="btn-start"></button>
    <button id="btn-stop"></button>
    <button id="btn-copy"></button>
    <button id="btn-clear"></button>
  </div>
  <pre id="log"></pre>
  <!-- Reply row: commands that ask questions (setup, connect, cloud, repair)
       are answered here, not in an external console window. -->
  <div class="bar" id="stdin-bar" hidden>
    <span class="t" id="stdin-label"></span>
    <input id="stdin-input" type="text" autocomplete="off" spellcheck="false">
    <button id="btn-send"></button>
  </div>
</footer>

<script>
const API = "__GM_API_BASE__";
// Capability token: every page the server serves embeds it and sends it back
// on each POST. Any site open in the browser CAN send requests to 127.0.0.1
// (CORS does not block sending), but without the token they are refused
// before they reach the Api.
const TOKEN = "__GM_TOKEN__";
let CATALOG = [], SECTIONS = [], openCmd = null;
let view = localStorage.getItem("gm_view") || "overview";

// ── i18n ─────────────────────────────────────────────────────────
let LANG = localStorage.getItem("gm_lang") || "it";
const STRINGS = {
  it: {
    loading_catalog: "Carico il catalogo…",
    envs_title: "Strumenti",
    not_installed: "non installato",
    console_title: "Console",
    console_collapse: "Chiudi la console",

  ["Client MCP", "Le app AI (Claude, Cursor, VS Code…) che usano i tool tramite il protocollo MCP.", "The AI apps (Claude, Cursor, VS Code…) that use the tools through the MCP protocol."],
  ["Embedding", "Il modello che trasforma il testo in numeri per trovare le cose simili. Cambiarlo richiede di reindicizzare.", "The model that turns text into numbers to find similar things. Changing it requires reindexing."],
  ["Standalone", "Un tool registrato direttamente nei client, fuori dal gateway.", "A tool registered directly in the clients, outside the gateway."],
];

function T(key) { return (STRINGS[LANG] || STRINGS.it)[key] || key; }
const L = (it, en) => LANG === "en" ? en : it;

async function call(method, payload){
  // pywebview exposes the Api directly; in a browser it goes over HTTP.
  if (window.pywebview && window.pywebview.api && window.pywebview.api[method]){
    return await window.pywebview.api[method](payload ? JSON.stringify(payload) : "");
  }
  const r = await fetch(API + "/api/" + method, {
    method:"POST", headers:{"Content-Type":"application/json", "X-GM-Token":TOKEN},
    body: payload ? JSON.stringify(payload) : ""
  });
  return await r.json();
}

function el(tag, attrs = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;          // only for our own STRINGS
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined)
    n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}

const TOOLCOL = {"gray-matter": "var(--c-gm)", neuron: "var(--c-neuron)", neurag: "var(--c-neurag)"};
const tdot = key => el("span", {class:"tdot", style:"background:" + (TOOLCOL[key] || "var(--dim)")});

async function loadCatalog(){
  let res;
  try{
    res = await call("catalog", {lang: LANG});
  }catch(e){
    // Never a blank page: say what is happening and retry on our own.
    document.getElementById("body").replaceChildren(
      el("div", {class:"empty"}, T("no_backend") + " (" + e + ") " + T("retrying")));
    setTimeout(loadCatalog, 1500);
    return;
  }
  CATALOG = res.envs || [];
  SECTIONS = res.sections || [];
  // The version in the header: an old number here means a stale venv is
  // running — the first thing to check when "it does not work".
  if (res.version) document.getElementById("hdr-sub").textContent = "Control Center · v" + res.version;
  if (res.error) append("[!] " + res.error, "err");
  // the interpreter path is long: a tooltip, not a header row of its own
  document.getElementById("hdr-sub").title = res.python || "";
  renderNav();
  render();
}

// The sidebar: what you can look at, then what you can do, then the rest.
function navItems(){
  const sec = SECTIONS.map(s => ({key: s.key, icon: {ops:"▸", graph:"⚒", tools:"⚙", settings:"≡"}[s.key] || "•",
                                  name: s.label, meta: T("view_" + s.key + "_sub")}));
  const v = (key, icon) => ({key, icon, name: T("view_" + key), meta: T("view_" + key + "_sub")});
  return [[T("nav_status"), [v("overview", "◉"), v("graphs", "⬡")]],
          [T("nav_cmds"), sec],
          [T("nav_adv"), [v("bridges", "⇄")]],
          [T("nav_help"), [v("guide", "?")]]];
}

function go(key){
  view = key; openCmd = null;
  localStorage.setItem("gm_view", key);
  document.getElementById("cmd-filter").value = "";
  renderNav(); render();
  document.getElementById("body").scrollTop = 0;   // a new view starts at its top
}

function renderNav(){
  const nav = document.getElementById("views");
  nav.replaceChildren();
  const searching = !!document.getElementById("cmd-filter").value.trim();
  for (const [title, items] of navItems()){
    nav.append(el("h2", {}, title));
    for (const it of items)
      nav.append(el("button", {class:"nv", "aria-current": String(!searching && view === it.key),
                               onclick: () => go(it.key)},
        el("span", {class:"ic"}, it.icon), el("span", {class:"name"}, it.name),
        el("span", {class:"meta"}, it.meta)));
  }
}

function render(){
  const body = document.getElementById("body");
  body.replaceChildren();
  const q = document.getElementById("cmd-filter").value.trim().toLowerCase();
  if (q) return searchView(body, q);
  if (view === "graphs") return graphsPanel(body);
  if (view === "bridges") return bridgesView(body);
  if (view === "guide") return guideView(body);
  if (SECTIONS.some(s => s.key === view)) return sectionView(body, view);
  return overviewView(body);
}

const intro = key => el("p", {class:"intro", html: T("intro_" + key)});

// Card collapsible. The state lives in localStorage by key, not in the DOM:
// views are rebuilt from scratch, so any state kept in the element is lost.
function collapsible(card, head, key, closedByDefault){
  const saved = localStorage.getItem("gm_collapsed_" + key);
  if (saved === "1" || (saved === null && closedByDefault)) card.classList.add("collapsed");
  head.addEventListener("click", () => {
    const now = card.classList.toggle("collapsed");
    localStorage.setItem("gm_collapsed_" + key, now ? "1" : "0");
  });
  card.append(head);
  return card;
}
function groupCard(key, title, bodyEl, closedByDefault){
  const card = collapsible(el("div", {class:"grp"}), el("h3", {}, title), "grp_" + key, closedByDefault);
  card.append(bodyEl);
  return card;
}
function toolTitle(env){
  return [tdot(env.key), env.label, el("span", {class:"tsub"}, "· " + env.subtitle),
          el("span", {class:"tver"}, env.version ? "v" + env.version : "")];
}

function legendBox(){
  const box = el("div", {class:"legend"});
  for (const [sym, it, en] of LEGEND)
    box.append(el("div", {}, el("span", {class:"sym" + (/^[a-z]/i.test(sym) && !sym.startsWith("--") ? " w" : "")}, sym),
                   el("span", {}, L(it, en))));
  return box;
}

// ── command sections: one block per tool, never mixed ───────────────
function sectionView(body, sec){
  body.append(intro(sec));
  body.append(groupCard("legend", T("legend_title"), legendBox(), true));
  if (sec === "tools") body.append(groupCard("clients", T("clients_block"), clientsBlock()));
  for (const env of CATALOG){
    const blk = el("div", {class:"cmds"});
    body.append(groupCard(sec + ":" + env.key, toolTitle(env), blk));
    if (!env.installed){
      blk.append(el("div", {class:"hint"}, env.label + T("not_installed_detail")));
      if (env.installable) blk.append(el("button", {class:"go small", style:"justify-self:start",
        onclick: () => installEnv(env.key)}, T("ov_install") + env.label));
      continue;
    }
    if (env.error){ blk.append(el("div", {class:"hint l-err"}, "Catalog error: " + env.error)); continue; }
    if (!env.commands.length){ blk.append(el("div", {class:"hint"}, env.label + T("no_commands"))); continue; }
    let cmds = env.commands.filter(c => c.section === sec);
    if (sec === "settings" && cmds.some(c => c.name === "config")){
      // A tool's knobs are the heart of its settings: shown open, not behind a card.
      const knobs = el("div", {class:"knobs"});
      blk.append(el("div", {class:"sub-h"}, T("settings_params")),
                 el("div", {class:"hint"}, T("settings_hint")), knobs);
      configPanel(env, knobs);
      cmds = cmds.filter(c => c.name !== "config");
      if (cmds.length) blk.append(el("div", {class:"sub-h"}, T("settings_other")));
    }
    if (!cmds.length && sec !== "settings") blk.append(el("div", {class:"hint"}, T("no_cmds_here")));
    for (const c of cmds) blk.append(commandCard(env, c));
  }
  if (sec === "settings"){
    const cards = el("div", {class:"cards"});
    body.append(groupCard("connections", T("conn_title"), cards));
    infraCards(cards);
  }
}

function searchView(body, q){
  body.append(el("p", {class:"intro"}, T("search_title") + "“" + q + "”"));
  const label = Object.fromEntries(SECTIONS.map(s => [s.key, s.label]));
  let any = false;
  for (const env of CATALOG.filter(e => e.installed)){
    const hits = env.commands.filter(c => [c.name, c.help, c.when, ...c.args.map(a => a.dest + " " + a.doc)]
      .join(" ").toLowerCase().includes(q));
    if (!hits.length) continue;
    any = true;
    const blk = el("div", {class:"cmds"});
    for (const c of hits) blk.append(commandCard(env, c, label[c.section]));
    body.append(groupCard("search:" + env.key, toolTitle(env), blk));
  }
  if (!any) body.append(el("div", {class:"empty"}, T("search_none")));
}

function guideView(body){
  body.append(intro("guide"));
  body.append(groupCard("guide-legend", T("legend_title"), legendBox()));
  const g = el("div", {class:"legend"});
  for (const [term, it, en] of GLOSSARY)
    g.append(el("div", {}, el("span", {class:"sym w"}, term), el("span", {}, L(it, en))));
  body.append(groupCard("guide-gloss", T("gloss_title"), g));
}

// ── one command ──────────────────────────────────────────────────────
// What the user would type in a terminal. Mirrors webgui._argv_for: flags,
// then "--opt value", then positionals, in the parser's order.
const shq = s => /[\s"'&|<>^;]/.test(s) || s === "" ? '"' + s.replace(/"/g, '\\"') + '"' : s;
function cmdLine(env, c, values, extra){
  const out = [env.key, c.name];
  for (const a of c.args){
    const v = values[a.dest];
    if (a.is_flag){ if (v) out.push(a.flag); }
    else if (a.flag){ if (String(v || "").trim()) out.push(a.flag, shq(String(v).trim())); }
    else if (String(v || "").trim()) out.push(shq(String(v).trim()));
  }
  if (extra && extra.trim()) out.push(extra.trim());
  return out.join(" ");
}
function synopsis(env, c){
  return [env.key, c.name, ...c.args.map(a => {
    const name = a.flag || "<" + a.dest + ">";
    const s = a.is_flag || !a.flag ? name : name + " …";
    return a.required ? s : "[" + s + "]";
  })].join(" ");
}

const SPECIAL = {repair: "repair_hint", uninstall: "uninstall_hint", link: "link_hint"};

function commandCard(env, c, badge){
  const id = env.key + ":" + c.name;
  const open = openCmd === id;
  const toggle = () => { openCmd = open ? null : id; render(); };
  const card = el("div", {class:"cmd", "aria-expanded": String(open), title: open ? null : "$ " + synopsis(env, c),
                          onclick: (ev) => { if (!open) toggle(); }},
    el("div", {class:"n", onclick: (ev) => { if (open){ ev.stopPropagation(); toggle(); } }}, c.name),
    el("div", {class:"h"}, c.help || "",
       c.interactive ? el("span", {class:"badge ask"}, T("badge_ask")) : null,
       badge ? el("span", {class:"badge"}, badge) : null));
  if (!open) return card;

  // "When to use it" only on an open card: closed, the list must stay
  // scannable; open is when one wonders "is this the right one now?".
  if (c.when) card.append(el("div", {class:"when"}, el("span", {class:"when-k"}, T("when_label")), c.when));

  // config, repair, uninstall and link are panels, not generic forms.
  if (c.name === "config" || SPECIAL[c.name]){
    const panel = el("div", {class:"form"});
    const box = el("div", {class:"knobs"});
    panel.append(el("div", {class:"hint"}, T(SPECIAL[c.name] || "settings_hint")), box);
    ({config: configPanel, repair: repairPanel, uninstall: uninstallPanel, link: linkPanel})[c.name](env, box);
    card.append(panel);
    return card;
  }

  const form = el("div", {class:"form"});
  const inputs = {};
  const line = el("code");
  const extra = el("input", {type:"text", placeholder: T("extra_placeholder")});
  const refresh = () => {
    const vals = {};
    for (const [dest, o] of Object.entries(inputs)) vals[dest] = o.spec.is_flag ? o.field.checked : o.field.value;
    line.textContent = cmdLine(env, c, vals, extra.value);
  };
  for (const a of c.args){
    let field;
    if (a.is_flag){
      field = el("input", {type:"checkbox", id:"f_"+a.dest});
    } else if (a.choices && a.choices.length){
      field = el("select", {id:"f_"+a.dest},
                 ...(a.required ? [] : [el("option", {value:""}, T("leave_empty"))]),
                 ...a.choices.map(o => el("option", {value:o}, o)));
    } else {
      field = el("input", {type:"text", id:"f_"+a.dest, placeholder: a.required ? T("required") : T("optional")});
    }
    field.addEventListener("input", refresh);
    field.addEventListener("change", refresh);
    inputs[a.dest] = {field, spec:a};
    form.append(el("div", {class:"row"},
      el("label", {for:"f_"+a.dest}, a.flag || "<" + a.dest + ">", a.required ? el("span", {class:"req"}, " *") : ""),
      el("div", {}, field, a.doc ? el("div", {class:"doc"}, a.doc) : "")));
  }
  extra.addEventListener("input", refresh);
  form.append(el("details", {}, el("summary", {class:"hint"}, T("expert_args")), extra));
  if (!c.args.length) form.append(el("div", {class:"hint"}, T("no_params_hint")));
  if (c.interactive) form.append(el("div", {class:"hint", style:"color:var(--warn)"}, T("interactive_hint")));

  const copyBtn = el("button", {}, T("btn_copy"));
  copyBtn.addEventListener("click", async () => {
    const ok = await copyText(line.textContent);
    copyBtn.textContent = ok ? T("copied") : T("copy_fail");
    setTimeout(() => { copyBtn.textContent = T("btn_copy"); }, 1400);
  });
  form.append(el("div", {class:"hint"}, T("cmd_line_hint")),
              el("div", {class:"cline"}, el("span", {class:"pr"}, "$"), line, copyBtn));
  form.append(el("div", {class:"actions"},
    el("button", {class:"go", onclick: () => runCmd(env.key, c, inputs, extra.value)}, T("btn_run"))));
  refresh();
  card.append(form);
  return card;
}

// --- pannello Ripara (reinstall pulito) ---------------------------------
async function repairPanel(env, container){
  container.replaceChildren(el("div", {class:"hint"}, T("loading")));
  // Se la volta scorsa l'installer ha chiuso questa finestra, l'esito e su
  // disco e non lo ha mai visto nessuno. Mostrarlo all'apertura del pannello e
  // il momento giusto: e' esattamente qui che si torna per sapere com'e andata.
  try {
    const prev = await call("operation_log", {key: env.key + ":repair"});
    if (prev && prev.found){
      append("[repair] " + (prev.running ? T("last_op_running")
                                         : T("last_op_done") + " " + prev.exit),
             prev.running ? "warn" : (prev.exit === 0 ? "ok" : "err"));
      for (const ln of prev.tail.slice(-25)) append("  " + ln, "");
    }
  } catch(e){ /* nessun esito precedente: non e' un errore */ }
  let r;
  try { r = await call("repair_state", {scope: env.key}); }
  catch(e){     container.replaceChildren(el("div", {class:"hint"}, "repair: " + e)); return; }
  container.replaceChildren();
  if (!r || !r.ok){
    container.append(el("div", {class:"hint"}, (r && r.error) || T("no_repair")));
    return;
  }
  container.append(el("div", {class:"hint"},
    "Ambito: " + (r.scope || env.key) + " — reinstall: " + (r.reinstall || "?")));
  const checks = {};
  for (const t of (r.targets || [])){
    const cb = el("input", {type:"checkbox", id:"w_"+t.key});
    cb.disabled = !t.exists;
    checks[t.key] = cb;
    container.append(el("div", {class:"row"},
      el("label", {for:"w_"+t.key}, t.label,
         t.exists ? "" : el("span", {class:"hint"}, " (assente)")),
      el("div", {}, cb, el("div", {class:"hint"}, t.path))));
  }
  if (!r.installer)
    container.append(el("div", {class:"hint", style:"color:var(--warn)"},
      "⚠ Installer non raggiungibile da qui: farò `pip --force-reinstall` dai sorgenti (se presenti)."));
  let armed = false;
  const btn = el("button", {class:"go"}, T("btn_repair"));
  btn.addEventListener("click", async () => {
    const wipe = Object.entries(checks)
      .filter(([k, cb]) => cb.checked && !cb.disabled).map(([k]) => k);
    if (!armed){
      armed = true;
      btn.textContent = wipe.length
        ? (T("confirm_reinstall_wipe") + wipe.length + " + reinstall")
        : T("confirm_reinstall_clean");
      btn.style.background = "var(--err)";
      setTimeout(() => { armed = false; btn.textContent = T("btn_repair"); btn.style.background = ""; }, 4000);
      return;
    }
    armed = false; btn.textContent = T("btn_repair"); btn.style.background = "";
    // L'installer ferma OGNI processo del venv di Gray Matter, e questa finestra
    // e uno di quelli: sparira mentre la riparazione va avanti. Dirlo prima, e
    // dire dove ritrovare l'esito, e la differenza fra "si e chiuso tutto e non
    // so cosa sia successo" e un'operazione che si puo seguire.
    append("[repair] " + T("repair_will_close"), "warn");
    const rr = await call("repair_run", {scope: env.key, wipe});
    if (rr && rr.error) append("[!] " + rr.error, "err");
  });
  container.append(btn);
}

// --- pannello Disinstalla ------------------------------------------------
async function uninstallPanel(env, container){
  container.replaceChildren(el("div", {class:"hint"}, T("loading")));
  let r;
  try { r = await call("uninstall_state", {scope: env.key}); }
  catch(e){     container.replaceChildren(el("div", {class:"hint"}, "uninstall: " + e)); return; }
  container.replaceChildren();
  if (!r || !r.ok){
    container.append(el("div", {class:"hint"}, (r && r.error) || T("no_uninstall")));
    return;
  }
  container.append(el("div", {class:"hint"}, "Ambito: " + (r.scope || env.key)));
  const checks = {};
  for (const t of (r.targets || [])){
    // Only the venv is a real choice. Hooks and code are removed by every
    // uninstall — they were rendered as tickboxes whose state was collected
    // into `checks` and then never sent anywhere, so unticking them looked
    // like it did something and did not.
    const optional = t.key === "venv";
    const cb = el("input", {type:"checkbox", id:"ut_"+t.key});
    cb.checked = optional ? (t.default === true) : true;
    cb.disabled = !optional;
    checks[t.key] = cb;
    const note = optional
      ? (t.size ? " — " + t.size : "")
      : (LANG === "en" ? " — always removed" : " — sempre rimosso");
    container.append(el("div", {class:"row"},
      el("label", {for:"ut_"+t.key}, t.label, note,
         t.exists ? "" : el("span", {class:"hint"}, " (assente)")),
      el("div", {}, cb, el("div", {class:"hint"}, t.path))));
  }
  const dataChecks = {};
  for (const d of (r.data || [])){
    const cb = el("input", {type:"checkbox", id:"ud_"+d.key});
    cb.disabled = !d.exists;
    dataChecks[d.key] = cb;
    container.append(el("div", {class:"row"},
      el("label", {for:"ud_"+d.key}, d.name,
         d.exists ? "" : el("span", {class:"hint"}, " (assente)")),
      el("div", {}, cb, el("div", {class:"hint"}, d.path))));
  }
  const purgeCb = el("input", {type:"checkbox", id:"upurge"});
  container.append(el("div", {class:"row"},
    el("label", {for:"upurge"}, LANG === "en" ? "Purge all" : "Purge totale"),
    el("div", {}, purgeCb, el("div", {class:"hint"}, LANG === "en" ? "Remove ALL data (ignores above choices)" : "Rimuovi TUTTI i dati (ignora le scelte sopra)"))));
  const resultBox = el("div", {});
  let armed = false;
  const btn = el("button", {class:"go"}, T("btn_uninstall"));
  btn.addEventListener("click", async () => {
    if (!armed){
      armed = true;
      btn.textContent = T("btn_confirm") + (r.scope || env.key);
      btn.style.background = "var(--err)";
      setTimeout(() => { armed = false; btn.textContent = T("btn_uninstall"); btn.style.background = ""; }, 4000);
      return;
    }
    armed = false; btn.textContent = T("btn_uninstall"); btn.style.background = "";
    btn.disabled = true;
    const purge = purgeCb.checked;
    resultBox.replaceChildren(el("div", {class:"hint"}, T("migrating")));
    const rr = await call("uninstall_run", {scope: env.key, purge_data: purge,
                                            remove_venv: !!(checks.venv && checks.venv.checked)});
    btn.disabled = false;
    resultBox.replaceChildren();
    if (rr && rr.error){
      resultBox.append(el("div", {class:"hint", style:"color:var(--err)"}, "Error: " + rr.error));
      return;
    }
    const v = (rr && rr.verification) || {};
    if (v.ok){
      resultBox.append(el("div", {class:"hint", style:"color:var(--ok)"},
        T("verified_ok")));
    } else {
      const failed = Object.entries(v.checks || {}).filter(([,ok]) => !ok).map(([k]) => k);
      resultBox.append(el("div", {class:"hint", style:"color:var(--err)"},
        T("verify_failed") + (failed.join(", ") || (LANG === "en" ? "unknown" : "sconosciuto"))));
    }
  });
  container.append(btn, resultBox);
}

// --- pannello Link (gm_link) --------------------------------------------

async function linkPanel(env, container){
  container.replaceChildren(el("div", {class:"hint"}, T("loading")));
  let r;
  try { r = await call("link_state", {}); }
  catch(e){     container.replaceChildren(el("div", {class:"hint"}, "link: " + e)); return; }
  container.replaceChildren();
  if (!r || !r.ok){
    container.append(el("div", {class:"hint"}, (r && r.error) || T("no_link")));
    return;
  }
  const tools = r.tools || [];
  if (!tools.length){
    container.append(el("div", {class:"hint"}, T("no_tools")));
    return;
  }
  const anyStandalone = tools.some(t => t.standalone);
  const checks = {};
  for (const t of tools){
    const label = t.label || t.key;
    let statusText, statusColor;
    if (!t.installed){ statusText = T("status_not_installed"); statusColor = "var(--dim)"; }
    else if (t.standalone){ statusText = T("status_standalone"); statusColor = "var(--warn)"; }
    else { statusText = T("status_managed"); statusColor = "var(--ok)"; }
    if (t.standalone){
      const cb = el("input", {type:"checkbox", id:"lk_"+t.key, checked: true});
      checks[t.key] = cb;
      container.append(el("div", {class:"row"},
        el("label", {for:"lk_"+t.key}, label),
        el("div", {}, cb, el("span", {class:"hint", style:"color:"+statusColor}, " " + statusText))));
    } else {
      container.append(el("div", {class:"row"},
        el("label", {}, label),
        el("div", {}, el("span", {class:"hint", style:"color:"+statusColor}, statusText))));
    }
  }
  const resultBox = el("div", {});
  if (!anyStandalone){
    resultBox.append(el("div", {class:"hint"}, T("no_standalone")));
    container.append(resultBox);
    return;
  }
  let armed = false;
  const btn = el("button", {class:"go"}, T("btn_link"));
  btn.addEventListener("click", async () => {
    if (!armed){
      armed = true;
      btn.textContent = T("btn_confirm") + (LANG === "en" ? "re-link" : "ricollega");
      btn.style.background = "var(--warn)";
      setTimeout(() => { armed = false; btn.textContent = T("btn_link"); btn.style.background = ""; }, 4000);
      return;
    }
    armed = false; btn.textContent = T("btn_link"); btn.style.background = "";
    btn.disabled = true;
    const selected = Object.entries(checks).filter(([,cb]) => cb.checked).map(([k]) => k);
    if (!selected.length){
      resultBox.replaceChildren(el("div", {class:"hint"}, T("no_tools")));
      btn.disabled = false;
      return;
    }
    resultBox.replaceChildren(el("div", {class:"hint"}, T("migrating")));
    const rr = await call("link_run", {tools: selected});
    btn.disabled = false;
    resultBox.replaceChildren();
    if (rr && rr.error){
      resultBox.append(el("div", {class:"hint", style:"color:var(--err)"}, "Error: " + rr.error));
      return;
    }
    if (rr && rr.ok){
      resultBox.append(el("div", {class:"hint", style:"color:var(--ok)"},
        T("linked_ok") + (rr.linked || []).join(", ") + T("restart_hint")));
    } else {
      const why = (rr.skipped || []).map(s => s.tool + ": " + s.reason).join("; ");
      resultBox.append(el("div", {class:"hint", style:"color:var(--warn)"},
        T("none_linked") + (why ? " (" + why + ")" : "") + "."));
    }
  });
  container.append(btn, resultBox);
}

function knobRow(env, k){
  const status = el("span", {class:"hint kstat"}, "");
  const save = (value) => saveKnob(env, k, value, status, badge, reset, control);
  let control;
  if (k.type === "bool"){
    control = el("input", {type:"checkbox", id:"k_"+env.key+k.key});
    control.checked = !!k.value;
    control.addEventListener("change", () => save(control.checked));
  } else if (k.suggest && k.suggest.length){
    const cur = k.value == null ? "" : String(k.value);
    const opts = k.suggest.map(String);
    if (!opts.includes(cur)) opts.push(cur);
    control = el("select", {id:"k_"+env.key+k.key},
      ...opts.map(o => {
        const opt = el("option", {value:o}, o === "" ? "(default)" : o);
        if (o === cur) opt.selected = true;
        return opt;
      }));
    control.addEventListener("change", () => save(control.value));
  } else {
    control = el("input", {
      type: (k.type === "int" || k.type === "float") ? "number" : "text",
      id:"k_"+env.key+k.key, value: k.value == null ? "" : String(k.value)});
    control.addEventListener("keydown", (e) => {
      if (e.key === "Enter"){ e.preventDefault(); save(control.value); }});
    control.addEventListener("blur", () => { if (String(control.value) !== String(k.value ?? "")) save(control.value); });
  }
  const changed = k.value !== k.default;
  const badge = el("span", {class:"pill", style: changed ? "" : "display:none"}, T("knob_changed"));
  const reset = el("button", {class:"ghost", title: T("knob_reset") + " (" + k.default + ")",
                              style: changed ? "margin-left:6px" : "display:none"}, "↺");
  reset.addEventListener("click", () => save(k.default));
  return el("div", {class:"row", title: "$ " + env.key + " config set " + k.key + " <" + (LANG === "en" ? "value" : "valore") + ">"},
    el("label", {for:"k_"+env.key+k.key}, k.key, " ", badge),
    el("div", {}, el("div", {style:"display:flex;align-items:center"}, control, reset),
       k.help ? el("div", {class:"doc"}, k.help) : "", status));
}

async function saveKnob(env, k, value, status, badge, reset, control){
  status.textContent = T("knob_saving"); status.style.color = "";
  let r;
  try { r = await call("config_set", {tool: env.key, key: k.key, value}); }
  catch(e){ status.textContent = " ✗ " + e; status.style.color = "var(--err)"; return; }
  if (r && r.ok){
    k.value = r.value;
    if (control.type === "checkbox") control.checked = !!r.value;
    else control.value = r.value == null ? "" : String(r.value);
    status.textContent = " ✓"; status.style.color = "var(--ok)";
    const changed = r.value !== k.default;
    badge.style.display = changed ? "" : "none";
    reset.style.display = changed ? "" : "none";
    setTimeout(() => { status.textContent = ""; }, 1400);
  } else {
    status.textContent = " ✗ " + ((r && r.error) || "error");
    status.style.color = "var(--err)";
  }
}

// Clipboard: WebView2/pywebview sometimes lack navigator.clipboard, so a
// textarea+execCommand fallback, and as the last net a Python Api method.
async function copyText(text){
  if (!text.trim()) return false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text); return true;
    }
  } catch(e){ /* falls back */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if (ok) return true;
  } catch(e){ /* last net: Python */ }
  try {
    const r = await call("copy_clipboard", {text});
    return !!(r && r.ok);
  } catch(e){ return false; }
}
document.getElementById("btn-copy").addEventListener("click", async () => {
  const btn = document.getElementById("btn-copy");
  const ok = await copyText(document.getElementById("log").innerText || "");
  btn.textContent = ok ? T("copied") : T("copy_fail");
  setTimeout(() => { btn.textContent = T("btn_copy"); }, 1500);

  try{
    const r = await call("poll_log");
    for (const l of (r.lines || [])) append(l.line, l.tag);
    const running = Object.values(r.running || {});
    document.getElementById("running").textContent =
      running.length ? "▶ " + running.join(", ") : "";
    // A command just started: open the console, that is where its output goes.
    if (running.length && !wasRunning && localStorage.getItem("gm_console_collapsed") === "1"){
      localStorage.setItem("gm_console_collapsed", "0");
      applyConsoleCollapsed();
    }
    wasRunning = running.length > 0;
    // The reply row exists only while a command runs.
    const bar = document.getElementById("stdin-bar");
    const wasHidden = bar.hidden;
    bar.hidden = running.length === 0;
    if (wasHidden && !bar.hidden) document.getElementById("stdin-input").focus();
  }catch(e){ /* window closing */ }
  setTimeout(poll, 400);
}

// Parse the formatted text `neuron status` returns. The worker renders it
// either multi-line or as one "a | b | c" line, so every field stops at the
// first "|" or newline; anything unmatched stays null and renders "?".
function parseNeuronStats(raw){
  const g = (re) => { const m = raw.match(re); return m ? m[1].trim() : null; };
  const core = raw.match(/Turn (\d+) \| Nodes: (\d+) \| Links: (\d+) \(active (\d+)\)/);
  return {
    ctx: g(/Context:\s*([^|\n]+)/),
    turn: core ? core[1] : null,
    nodes: core ? core[2] : null,
    links: core ? core[3] : null,
    active: core ? core[4] : null,
    engine: g(/Engine:\s*([^|\n]+?)\s*(?:\|\s*Embedding|$)/),
    loop: (() => { const l = raw.match(/pre_turn (\d+)\s*\|\s*store_turn (\d+)/);
                   return l ? `${l[1]}/${l[2]}` : null; })(),
  };
}

let CLIENT_SEL = new Set();

function clientsBlock(){
  const box = el("div");
  const grid = el("div", {class:"clients-grid"});
  const probs = el("div", {class:"client-problems", style:"display:none"});
  box.append(el("div", {class:"hint", style:"margin-bottom:8px"}, T("clients_sub")), grid, probs,
    el("div", {class:"actions"},
      el("button", {class:"go small", onclick: () => registerClients(load)}, T("clients_register")),
      el("button", {class:"ghost", onclick: () => load()}, T("clients_refresh"))));
  async function load(){
    let st;
    try { st = await call("clients_state", ""); } catch(e){ return; }
    if (!st || !st.ok){ grid.replaceChildren(el("div", {class:"hint"}, (st && st.error) || "?")); return; }
    grid.replaceChildren();
    for (const c of (st.clients || [])){
      const bad = !!c.problem;
      const item = el("div", {class:"client-item" + (c.detected ? "" : " absent") + (bad ? " bad" : "")});
      const dot  = el("span", {class:"dot" + (c.registered ? " on" : "") + (bad ? " warn" : "")});
      const cb   = el("input", {type:"checkbox"});
      cb.checked = CLIENT_SEL.has(c.key) || (c.detected && !c.registered);
      if (cb.checked) CLIENT_SEL.add(c.key);
      cb.onchange = () => { cb.checked ? CLIENT_SEL.add(c.key) : CLIENT_SEL.delete(c.key); };
      item.append(cb, dot, el("span", {}, c.label));
      if (!c.detected) item.append(el("span", {class:"hint"}, " " + T("clients_absent")));
      item.onclick = (ev) => { if (ev.target !== cb){ cb.checked = !cb.checked; cb.onchange(); } };
      grid.append(item);
    }
    // The error register: never silently skip a config we could not use.
    const withProblems = (st.clients || []).filter(c => c.problem);
    if (withProblems.length){
      probs.replaceChildren(el("b", {}, T("clients_problems")));
      for (const c of withProblems) probs.append(el("div", {}, c.label + ": " + c.problem));
      probs.style.display = "";
    } else probs.style.display = "none";
  }
  load();
  return box;
}

async function registerClients(reload){
  const picked = [...CLIENT_SEL];
  if (!picked.length){ append("[clients] " + T("clients_none"), "warn"); return; }
  const res = await call("clients_register", {clients: picked, gateway: true});
  if (!res.ok && res.error){ append("[clients] " + res.error, "err"); return; }
  for (const r of (res.results || [])){
    const ok = r.ok || r.action === "skipped";
    append("[clients] " + r.client + ": " + r.action + (r.detail ? " — " + r.detail : ""), ok ? "ok" : "err");
    if (r.snippet) append(r.snippet, "warn");   // JSONC: hand the user valid JSON
  }
  if (res.ok) append("[clients] " + T("clients_ok"), "ok");
  reload();
}

    msg.replaceChildren();
    if (r && r.ok){ toast(T(r.created ? "br_created" : "br_reinforced"), "ok"); fN.value = fK.value = fR.value = ""; loadList(); return; }

      el("a", {href:"#", onclick: (ev) => { ev.preventDefault(); fK.value = r.suggest; }}, r.suggest));
  });
  const lab = (t, f) => el("div", {}, el("label", {}, t), f);
  body.append(groupCard("br-add", T("br_add_title"), el("div", {style:"display:grid;gap:8px"},
    el("div", {class:"hint"}, T("br_pick_hint")), dlN, dlK,
    el("div", {class:"bform"}, lab(T("br_neuron"), fN), lab(T("br_neurag"), fK), lab(T("br_rationale"), fR), add), msg)));

  const filter = el("input", {type:"search", placeholder: T("br_filter"), style:"max-width:320px;margin-bottom:8px"});
  const tbl = el("div");
  body.append(groupCard("br-list", T("br_list"), el("div", {}, filter, tbl)));
  let rows = [];
  filter.addEventListener("input", draw);

  async function loadList(){
    tbl.replaceChildren(el("div", {class:"hint"}, T("loading")));
    let r;
    try { r = await call("bridges_list"); } catch(e){ r = {error: String(e)}; }
    if (!r || !r.ok){ tbl.replaceChildren(el("div", {class:"hint l-err"}, (r && r.error) || "error")); return; }
    rows = r.bridges || [];
    draw();
  }
  function draw(){
    const q = filter.value.trim().toLowerCase();
    const vis = rows.filter(b => !q || [b.neuron, b.neurag, b.rationale].join(" ").toLowerCase().includes(q));
    if (!vis.length){ tbl.replaceChildren(el("div", {class:"hint"}, T("br_none"))); return; }
    const t = el("table", {class:"bt"}, el("tr", {},
      el("th", {}, "Neuron"), el("th", {}, "NeuRAG"), el("th", {}, T("br_weight")),
      el("th", {}, T("br_rationale")), el("th", {}, T("br_last")), el("th", {})));
    for (const b of vis) t.append(rowOf(b));
    tbl.replaceChildren(t, el("div", {class:"hint", style:"margin-top:6px"}, vis.length + " / " + rows.length));
  }
  function rowOf(b){
    const when = b.last_used ? new Date(b.last_used * 1000).toLocaleDateString(LANG === "en" ? "en-GB" : "it-IT") : "";
    const tr = el("tr");
    const showRow = () => {
      let armed = false;
      const del = el("button", {class:"ghost"}, T("br_delete"));
      del.addEventListener("click", async () => {
        if (!armed){ armed = true; del.textContent = T("br_confirm_delete"); del.style.color = "var(--err)";
                     setTimeout(() => { armed = false; del.textContent = T("br_delete"); del.style.color = ""; }, 4000); return; }
        const r = await call("bridge_remove", {neuron: b.neuron, neurag: b.neurag});
        if (r && r.ok) loadList(); else append("[bridge] " + ((r && r.error) || "error"), "err");
      });
      tr.replaceChildren(el("td", {class:"m"}, b.neuron), el("td", {class:"m"}, b.neurag),
        el("td", {class:"n"}, Number(b.weight || 0).toFixed(1)), el("td", {}, b.rationale || ""),
        el("td", {class:"n hint"}, when),
        el("td", {class:"a"}, el("button", {class:"ghost", onclick: edit}, T("br_edit")), " ", del));
    };
    const edit = () => {
      const fw = el("input", {type:"number", step:"0.5", min:"0.5", value: String(b.weight ?? 1), style:"width:80px"});
      const fr = el("input", {type:"text", value: b.rationale || ""});
      const save = el("button", {class:"go small"}, T("br_save"));
      save.addEventListener("click", async () => {
        const r = await call("bridge_update", {neuron: b.neuron, neurag: b.neurag, rationale: fr.value, weight: fw.value});
        if (r && r.ok) loadList(); else append("[bridge] " + ((r && r.error) || "error"), "err");
      });
      tr.replaceChildren(el("td", {class:"m"}, b.neuron), el("td", {class:"m"}, b.neurag),
        el("td", {class:"n"}, fw), el("td", {}, fr), el("td", {class:"n hint"}, when),
        el("td", {class:"a"}, save, " ", el("button", {class:"ghost", onclick: showRow}, T("br_cancel"))));
    };
    showRow();
    return tr;
  }
  loadList();

  const gm = CATALOG.find(e => e.key === "gray-matter");
  const tr = gm && gm.commands.find(c => c.name === "bridges-transfer");
  if (tr) body.append(groupCard("br-transfer", T("br_transfer"), el("div", {class:"cmds"}, commandCard(gm, tr))));
}

// ── Graphs view: Neuron, NeuRAG, bridges (bridges and KB nodes editable) ─────────────
// The data comes from the tools (Api.graphs -> daemon IPC), never from the
// stores; the library is vendored in assets/ so the view works offline.
const GCOL = {neuron:"#7aa2f7", neurag:"#bb9af7", fact:"#e0af68", bridge:"#9ece6a"};
let visReady = null;

function loadVis(){
  if (window.vis) return Promise.resolve();
  return visReady ||= new Promise((ok, ko) => document.head.append(el("script", {
    src: API + "/vis-network.min.js", onload: ok,
    onerror: () => { visReady = null; ko(new Error(T("graphs_lib_fail"))); }})));
}

// Payload -> {nodes, edges, byId, factsOf, bridgesOf, counts, errors}.
function graphModel(data){
  const nodes = [], edges = [], errors = [], byId = {}, bridgesOf = {};
  const add = n => { if (!byId[n.id]){ byId[n.id] = n; nodes.push(n); } return n.id; };
  const edge = e => edges.push(Object.assign({id: "e" + edges.length}, e));

  const nx = data.neuron || {};
  if (nx.error) errors.push("Neuron: " + nx.error);
  const facts = nx.facts || [], factById = {}, factsOf = {}, nOf = {};
  for (const f of facts){
    factById[f.id] = f;
    if (f.status === "active") for (const c of f.concepts || []) (factsOf[String(c).toLowerCase()] ||= []).push(f);
  }
  for (const n of nx.nodes || []){
    const fs = factsOf[n.keyword.toLowerCase()] || [];
    nOf[n.keyword.toLowerCase()] = add({id: "n:" + n.keyword, label: n.keyword, src: "neuron",
      kind: "concept", raw: n, value: 1 + fs.length,
      color: GCOL.neuron, title: (n.domain || "") + " · " + fs.length
                                + " " + T("graphs_fact_n")});
  }
  for (const l of nx.links || []){
    const a = nOf[String(l.source).toLowerCase()], b = nOf[String(l.target).toLowerCase()];
    if (a && b && a !== b) edge({from: a, to: b, src: "neuron", width: Math.min(4, .5 + (l.weight || 0)),
      title: l.link_type + (l.rationale ? ": " + l.rationale : "")});
  }

  const kx = data.neurag || {};
  if (kx.error) errors.push("NeuRAG: " + kx.error);
  const kOf = {};
  let archived = 0;
  for (const n of kx.nodes || []){
    const arch = (n.layer || 2) > 2;
    archived += arch;
    kOf[String(n.name).toLowerCase()] = add({id: "k:" + n.id, label: n.name, src: "neurag",
      kind: "kb", raw: n, archived: arch, opacity: arch ? .3 : 1, value: n.node_type === "godnode" ? 6 : 3,
      shape: n.node_type === "godnode" ? "star" : n.node_type === "fundamental" ? "diamond" : "dot",
      color: GCOL.neurag, font: arch ? {color: "#565f89"} : undefined,
      title: n.path + (arch ? " (" + T("graphs_archived_one") + ")" : "")});
    if (n.parent_id !== null && n.parent_id !== undefined && n.parent_id !== n.id)
      edge({from: "k:" + n.parent_id, to: "k:" + n.id, src: "neurag", dashes: [2, 4], title: "parent"});
  }
  for (const l of kx.links || [])
    edge({from: "k:" + l.source_id, to: "k:" + l.target_id, src: "neurag",
      title: l.link_type + " " + Number(l.weight || 0).toFixed(2) + (l.evidence ? "\n" + l.evidence : "")});

  const bx = data.bridges;
  if (bx && bx.error) errors.push("Bridges: " + bx.error);
  const ghost = (id, label) => add({id, label, src: "bridges", kind: "ghost", value: 1,
    color: {background: "transparent", border: GCOL.bridge}, shapeProperties: {borderDashes: [3, 3]}});
  const bridges = Array.isArray(bx) ? bx : [];
  for (const b of bridges){
    let from;
    if (String(b.neuron).startsWith("#")){
      const fid = b.neuron.slice(1), f = factById[fid];
      from = "f:" + fid;
      if (!byId[from]){
        add({id: from, label: b.neuron, src: "bridges", kind: "fact", raw: f, value: 1,
             color: GCOL.fact, title: f ? f.text : T("graphs_missing")});
        for (const c of (f && f.concepts) || [])
          if (nOf[c.toLowerCase()]) edge({from, to: nOf[c.toLowerCase()], src: "bridges", dashes: [1, 3]});
      }
    } else from = nOf[String(b.neuron).toLowerCase()] || ghost("n?:" + b.neuron, b.neuron);
    const to = kOf[String(b.neurag).toLowerCase()] || ghost("k?:" + b.neurag, b.neurag);
    for (const end of [from, to]) (bridgesOf[end] ||= []).push(b);
    edge({from, to, src: "bridges", bridge: b, color: {color: GCOL.bridge, highlight: GCOL.bridge},
      width: 1 + Math.min(3, (b.weight || 1) / 3),
      title: (b.rationale || "bridge") + " (w " + Number(b.weight || 0).toFixed(1) + ")"});
  }
  const active = facts.filter(f => f.status === "active").length;
  const counts = [(nx.nodes || []).length + " " + T("graphs_concepts"), active + " " + T("graphs_fact_n"),
    (kx.nodes || []).length + " " + T("graphs_kb_nodes") + " (" + archived + " " + T("graphs_archived_one") + ")",
    bridges.length + " " + T("graphs_bridge_n")].join(" · ");
  return {nodes, edges, byId, factsOf, bridgesOf, counts, errors};
}

// What a node stands for as a bridge end: a concept by keyword, a fact by
// "#id", a KB node by its exact name; null for anything else (ghost ends).
function bridgeEnd(n){
  if (!n || !n.raw) return null;
  if (n.kind === "concept") return {side: "neuron", name: n.raw.keyword};
  if (n.kind === "fact") return {side: "neuron", name: "#" + n.raw.id};
  if (n.kind === "kb") return {side: "neurag", name: n.raw.name};
  return null;
}

function graphSide(side, m, id, edgeId, g){
  side.replaceChildren();
  const n = m.byId[id];
  if (!n){
    const e = m.edges.find(x => x.id === edgeId);
    if (e && e.bridge) return bridgeEditor(side, e.bridge, g);
    side.append(e ? el("div", {class:"gfact"}, e.title || "") : el("div", {class:"hint"}, T("graphs_pick")));
    return;
  }
  side.append(el("h4", {}, n.label));
  const r = n.raw || {};
  const acts = el("div", {class:"actions", style:"margin:6px 0"});
  side.append(acts);
  const end = bridgeEnd(n);
  if (end) acts.append(el("button", {class:"ghost", onclick: () => g.startLink(id)},
    "⇄ " + T(end.side === "neuron" ? "graphs_link_kb" : "graphs_link_neuron")));
  if (n.kind === "concept"){
    side.append(el("div", {class:"hint"}, [r.domain, r.topic].filter(Boolean).join(" · ")),
                el("div", {class:"gk"}, T("graphs_facts")));
    const fs = m.factsOf[r.keyword.toLowerCase()] || [];
    if (!fs.length) side.append(el("div", {class:"hint"}, T("graphs_no_facts")));
    for (const f of fs) side.append(el("div", {class:"gfact"},
      el("div", {class:"gk"}, f.kind + " · #" + f.id + (f.confirmed ? " · ✓" + f.confirmed : "")),
      f.text));
  } else if (n.kind === "kb"){
    // NeuRAG's own commands, the same the Graph maintenance section runs.
    const runN = async (command, args, label) => {
      const res = await call("run", {tool: "neurag", command, args});
      if (res && res.error){ toast(res.error, "err"); return; }
      toast(label + " — " + T("gr_done_reload"), "ok");
      setTimeout(g.reload, 2500);
    };
    acts.append(el("button", {class:"ghost", onclick: () =>
      runN("archive", n.archived ? {name: r.name, restore: true} : {name: r.name},
           T(n.archived ? "gr_restore" : "gr_archive"))}, T(n.archived ? "gr_restore" : "gr_archive")));
    const nn = el("input", {type:"text", placeholder: T("gr_rename_ph"), style:"width:140px"});
    acts.append(nn, el("button", {class:"ghost", onclick: () => nn.value.trim() &&
      runN("rename-node", {name: r.name, new_name: nn.value.trim()}, T("gr_rename"))}, T("gr_rename")));
    side.append(el("div", {class:"hint"}, r.path),
      el("div", {class:"gk"}, r.node_type + " · layer " + (r.layer || 2)
                              + (n.archived ? " · " + T("graphs_archived_one") : "")));
    let tags = [];
    try { tags = JSON.parse(r.tags || "[]"); } catch (_) {}
    if (tags.length) side.append(el("div", {class:"hint"}, tags.join(", ")));
  } else if (n.kind === "fact"){
    side.append(n.raw ? el("div", {class:"gfact"},
      el("div", {class:"gk"}, r.kind + " · " + r.status + " · " + (r.concepts || []).join(", ")), r.text)
      : el("div", {class:"hint"}, T("graphs_missing")));
  } else side.append(el("div", {class:"hint"}, T("graphs_missing")));
  const bs = m.bridgesOf[id] || [];
  if (bs.length) side.append(el("div", {class:"gk"}, T("graphs_bridge_list")));
  for (const b of bs) side.append(el("div", {class:"gfact", style:"border-color:" + GCOL.bridge + ";cursor:pointer",
    onclick: () => bridgeEditor(side, b, g)},
    el("div", {class:"gk"}, b.neuron + " ↔ " + b.neurag + " · w " + Number(b.weight || 0).toFixed(1)),
    b.rationale || ""));
}

// Edit or delete one bridge (GM's own store), from the graph.
function bridgeEditor(side, b, g){
  side.replaceChildren(el("h4", {}, b.neuron + " ↔ " + b.neurag),
    el("div", {class:"hint"}, T("intro_bridges_short")));
  const fr = el("input", {type:"text", value: b.rationale || ""});
  const fw = el("input", {type:"number", step:"0.5", min:"0.5", value: String(b.weight ?? 1)});
  const save = el("button", {class:"go small"}, T("br_save"));
  save.addEventListener("click", async () => {
    const r = await call("bridge_update", {neuron: b.neuron, neurag: b.neurag, rationale: fr.value, weight: fw.value});
    if (r && r.ok){ toast(T("br_saved"), "ok"); g.reload(); } else toast((r && r.error) || "error", "err");
  });
  let armed = false;
  const del = el("button", {class:"ghost"}, T("br_delete"));
  del.addEventListener("click", async () => {
    if (!armed){ armed = true; del.textContent = T("br_confirm_delete"); del.style.color = "var(--err)"; return; }
    const r = await call("bridge_remove", {neuron: b.neuron, neurag: b.neurag});
    if (r && r.ok){ toast(T("br_removed"), "ok"); g.reload(); } else toast((r && r.error) || "error", "err");
  });
  side.append(el("div", {class:"gk"}, T("br_rationale")), fr,
              el("div", {class:"gk"}, T("br_weight")), fw,
              el("div", {class:"actions", style:"margin-top:10px"}, save, del));
}

// Ask for the rationale of a bridge drawn on the graph, then save it.
function newBridgeForm(side, a, b, g){
  const nEnd = a.side === "neuron" ? a : b, kEnd = a.side === "neuron" ? b : a;
  const fr = el("input", {type:"text", placeholder: T("br_rationale")});
  const save = el("button", {class:"go small"}, T("br_add"));
  const msg = el("div", {class:"hint"});
  save.addEventListener("click", async () => {
    save.disabled = true;
    const r = await call("bridge_add", {neuron: nEnd.name, neurag: kEnd.name, rationale: fr.value});
    save.disabled = false;
    if (r && r.ok){ toast(T(r.created ? "br_created" : "br_reinforced"), "ok"); g.reload(); }
    else msg.replaceChildren(el("span", {class:"l-err"}, (r && r.error) || "error"));
  });
  side.replaceChildren(el("h4", {}, T("graphs_new_bridge")),
    el("div", {class:"gfact", style:"border-color:" + GCOL.bridge},
      el("div", {class:"gk"}, "Neuron"), nEnd.name, el("div", {class:"gk"}, "NeuRAG"), kEnd.name),
    el("div", {class:"gk"}, T("br_rationale")), fr,
    el("div", {class:"actions", style:"margin-top:10px"}, save,
       el("button", {class:"ghost", onclick: () => graphSide(side, {byId:{}, edges:[]}, null)}, T("br_cancel"))), msg);
  fr.focus();
}

// Physics knobs, Obsidian-style: kept per viewer in localStorage.
const PHYS_DEFAULT = {repulsion: 45, central: 1, spring: 90, stiff: 8, live: false};
function physOptions(p){
  return {solver: "forceAtlas2Based", stabilization: {iterations: 250},
          forceAtlas2Based: {gravitationalConstant: -p.repulsion, centralGravity: p.central / 100,
                             springLength: p.spring, springConstant: p.stiff / 100, avoidOverlap: .2,
                             damping: .5}};
}
function loadPhys(){
  try { return Object.assign({}, PHYS_DEFAULT, JSON.parse(localStorage.getItem("gm_graph_phys") || "{}")); }
  catch (_) { return Object.assign({}, PHYS_DEFAULT); }
}

async function graphsPanel(body){
  const shows = {neuron: true, neurag: true, bridges: true, archived: true};
  const phys = loadPhys();
  const net = el("div", {id:"gnet"}, el("div", {class:"empty", style:"padding:22px"}, T("loading")));
  const side = el("div", {id:"gside"}, el("div", {class:"hint"}, T("graphs_pick")));
  const stats = el("span");
  const search = el("input", {type:"search", placeholder: T("graphs_search")});
  const boxes = Object.keys(shows).map(k => el("label", {},
    el("input", {type:"checkbox", checked:"", onchange: ev => { shows[k] = ev.target.checked; draw(); }}),
    k === "archived" ? null : el("span", {class:"gsw", style:"background:" + GCOL[k === "bridges" ? "bridge" : k]}),
    T("graphs_" + k)));
  const linkBtn = el("button", {class:"gbtn", title: T("graphs_link_hint")}, "⇄ " + T("graphs_link"));
  const physBtn = el("button", {class:"gbtn"}, "⚙ " + T("graphs_physics"));
  const fitBtn = el("button", {class:"gbtn"}, "⤢ " + T("graphs_fit"));
  const physBox = el("div", {class:"gphys", hidden:""});
  const banner = el("div", {class:"gbanner", hidden:""});
  body.append(el("div", {class:"graphs"},
    el("div", {class:"gbar"}, ...boxes, search, linkBtn, physBtn, fitBtn,
       el("button", {class:"gbtn", onclick: () => render()}, "↻ " + T("graphs_reload")), stats),
    physBox, banner,
    el("div", {class:"gwrap"}, net, side)));

  let data;
  try { await loadVis(); data = await call("graphs"); }
  catch (e){ net.replaceChildren(el("div", {class:"empty l-err", style:"padding:22px"}, String(e))); return; }
  if (view !== "graphs" || !net.isConnected) return;     // the user moved on meanwhile
  const m = graphModel(data || {});
  stats.textContent = m.counts;
  if (data && data.error) m.errors.push(data.error);
  if (m.errors.length) stats.append(el("span", {class:"l-err"}, "  [!] " + m.errors.join(" | ")));

  net.replaceChildren();
  const dsN = new vis.DataSet(), dsE = new vis.DataSet();
  const network = new vis.Network(net, {nodes: dsN, edges: dsE}, {
    nodes: {shape: "dot", borderWidth: 1, scaling: {min: 5, max: 24, label: {enabled: false}},
            font: {color: "#c0caf5", size: 12, face: "Segoe UI"}},
    edges: {color: {color: "#3b4261", highlight: "#7aa2f7", hover: "#7aa2f7", inherit: false},
            smooth: false, width: 1, selectionWidth: 2},
    physics: physOptions(phys),
    interaction: {hover: true, tooltipDelay: 150, hideEdgesOnDrag: true, navigationButtons: false},
    manipulation: {enabled: false, addEdge: (edge, cb) => { cb(null); finishLink(edge.from, edge.to); }},
  });
  network.on("stabilizationIterationsDone", () => {
    if (!phys.live) network.setOptions({physics: false});
    network.fit({animation: {duration: 400}});
  });
  // Dragging a node wakes the simulation for a moment, like Obsidian.
  network.on("dragStart", p => { if (p.nodes.length) network.setOptions({physics: physOptions(phys)}); });
  network.on("dragEnd", () => { if (!phys.live) setTimeout(() => network.setOptions({physics: false}), 1500); });

  const g = {reload: () => { if (view === "graphs") render(); }, startLink};
  network.on("click", p => {
    if (linking){ if (pendingFrom && p.nodes[0] && p.nodes[0] !== pendingFrom) finishLink(pendingFrom, p.nodes[0]); return; }
    focusOn(p.nodes[0]);
    graphSide(side, m, p.nodes[0], p.edges[0], g);
  });

  // Obsidian-style focus: the picked node and its neighbours stay lit.
  let lit = null;
  function focusOn(id){
    const keep = id ? new Set([id, ...network.getConnectedNodes(id)]) : null;
    if (!keep && !lit) return;
    lit = keep;
    dsN.update(dsN.get().map(n => ({id: n.id,
      opacity: keep && !keep.has(n.id) ? .12 : (m.byId[n.id].archived ? .3 : 1)})));
  }

  function draw(){
    const keep = n => shows[n.src] && (shows.archived || !n.archived);
    const vn = m.nodes.filter(keep), ids = new Set(vn.map(n => n.id));
    lit = null;
    dsN.clear(); dsE.clear();
    dsN.add(vn);
    dsE.add(m.edges.filter(e => shows[e.src] && ids.has(e.from) && ids.has(e.to)));
    network.setOptions({physics: physOptions(phys)});
  }

  // Draw a bridge: drag from a Neuron end to a NeuRAG end (either way round).
  // From the side panel the start is known: the next clicked node ends it.
  let linking = false, pendingFrom = null;
  function startLink(fromId){
    linking = true;
    pendingFrom = fromId || null;
    banner.hidden = false;
    banner.replaceChildren(fromId ? el("b", {}, m.byId[fromId].label + " → ") : "",
      T(fromId ? "graphs_link_pick" : "graphs_link_hint"), " ",
      el("button", {class:"ghost", onclick: stopLink}, T("br_cancel")));
    linkBtn.classList.add("on");
    if (!fromId) network.addEdgeMode();
  }
  function stopLink(){
    linking = false; pendingFrom = null;
    banner.hidden = true; linkBtn.classList.remove("on");
    network.disableEditMode();
  }
  function finishLink(from, to){
    const a = bridgeEnd(m.byId[from]), b = bridgeEnd(m.byId[to]);
    stopLink();
    if (!a || !b || a.side === b.side){ toast(T("graphs_link_bad"), "warn"); return; }
    newBridgeForm(side, a, b, g);
  }
  linkBtn.addEventListener("click", () => linking ? stopLink() : startLink());
  fitBtn.addEventListener("click", () => network.fit({animation: true}));

  // The physics panel: four forces and "keep moving".
  const save = () => { try { localStorage.setItem("gm_graph_phys", JSON.stringify(phys)); } catch (_) {} };
  const slider = (key, min, max, step) => {
    const out = el("span", {class:"gval"}, String(phys[key]));
    const s = el("input", {type:"range", min, max, step, value: String(phys[key])});
    s.addEventListener("input", () => {
      phys[key] = Number(s.value); out.textContent = s.value; save();
      network.setOptions({physics: physOptions(phys)});
    });
    return el("label", {}, T("ph_" + key), s, out);
  };
  const live = el("input", {type:"checkbox"});
  live.checked = phys.live;
  live.addEventListener("change", () => {
    phys.live = live.checked; save();
    network.setOptions({physics: phys.live ? physOptions(phys) : false});
  });
  physBox.append(slider("repulsion", 5, 200, 5), slider("central", 0, 10, .5), slider("spring", 20, 300, 10),
    slider("stiff", 1, 30, 1), el("label", {}, live, T("ph_live")),
    el("button", {class:"gbtn", onclick: () => { network.setOptions({physics: physOptions(phys)}); network.stabilize(200); }},
       T("ph_relayout")),
    el("button", {class:"gbtn", onclick: () => { Object.assign(phys, PHYS_DEFAULT); save(); render(); }}, T("ph_reset")));
  physBtn.addEventListener("click", () => { physBox.hidden = !physBox.hidden; physBtn.classList.toggle("on", !physBox.hidden); });

  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    network.selectNodes(q ? m.nodes.filter(n => String(n.label).toLowerCase().includes(q)
                                                && dsN.get(n.id)).map(n => n.id) : []);
  });
  search.addEventListener("keydown", ev => {
    const sel = network.getSelectedNodes();
    if (ev.key !== "Enter" || !sel.length) return;
    network.focus(sel[0], {scale: 1.3, animation: true});
    focusOn(sel[0]);
    graphSide(side, m, sel[0], null, g);
  });
  draw();
}

// Short-lived notice in a corner: the outcome of a click, where the eye is.
function toast(msg, kind){
  let box = document.getElementById("toasts");
  if (!box) document.body.append(box = el("div", {id:"toasts"}));
  const t = el("div", {class:"toast " + (kind || "")}, msg);
  box.append(t);
  setTimeout(() => t.classList.add("out"), 3200);
  setTimeout(() => t.remove(), 3700);
}

// ── i18n: apply the language to the static parts ─────────────────
function applyLang(){
  localStorage.setItem("gm_lang", LANG);
  document.documentElement.lang = LANG;
  // gone once render() has replaced #body
  const loadingMsg = document.getElementById("loading-msg");
  if (loadingMsg) loadingMsg.textContent = T("loading_catalog");
  document.getElementById("cmd-filter").placeholder = T("filter_placeholder");
  document.getElementById("console-title").textContent = T("console_title");
  applyConsoleCollapsed();
  document.getElementById("btn-start").textContent = T("btn_start");
  document.getElementById("btn-stop").textContent = T("btn_stop");
  document.getElementById("btn-copy").textContent = T("btn_copy");
  document.getElementById("btn-copy").title = T("copy_hint");
  document.getElementById("btn-clear").textContent = T("btn_clear");
  document.getElementById("btn-send").textContent = T("btn_send");
  document.getElementById("stdin-label").textContent = T("stdin_label");
  document.getElementById("stdin-input").placeholder = T("stdin_hint");
  document.getElementById("btn-migrate-all").textContent = T("btn_migrate_all");
  document.getElementById("btn-migrate-dismiss").textContent = T("btn_ignore");
}

const langSel = document.getElementById("lang-select");
langSel.value = LANG;
langSel.addEventListener("change", () => {
  LANG = langSel.value;
  applyLang();
  // Command descriptions come from the backend already translated: the
  // catalog must be reloaded or they stay in the previous language.
  loadCatalog();
});

// The search box lives outside #body, so it survives every render.
document.getElementById("cmd-filter").addEventListener("input", () => { renderNav(); render(); });

applyLang();
loadCatalog();
poll();
refreshHealth();
setTimeout(checkMigration, 800);
</script>
