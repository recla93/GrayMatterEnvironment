; Pins rootdir to the workspace so the root conftest.py (sys.path setup) is
; always loaded. Without an ini file here pytest derives rootdir from the
; common ancestor of the args — e.g. `pytest gray_matter/tests` cuts the root
; conftest off and `import neuron.paths` then resolves to the empty namespace
; package `./neuron/` instead of `./neuron/src/neuron`.
;
; The three suites must run in SEPARATE processes: neuron/tests/_mockdeps.py
; injects fake mcp/fastembed and `turso = None` into sys.modules at import
; time, and neurag.db captures TURSO_AVAILABLE at ITS import time — one shared
; process leaks the fakes across repos (~25 spurious failures). Use:
;   pytest neuron/tests && pytest gray_matter/tests && pytest neurag/tests
;
; That rule is now ENFORCED by pytest_configure in the root conftest.py, which
; refuses a cross-suite run and prints those three lines — before, a bare
; `pytest` died on a basename collision with an unrelated hint about __pycache__.
;
; fastembed announces the mean-pooling change once per model load: 143 lines in
; the neurag suite for one piece of information, and a flood that hides any NEW
; warning in the summary — which is the only reason a warning list is worth
; reading. The notice is recorded here instead, so silencing it does not lose it:
;
;   sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 now uses mean
;   pooling instead of CLS embedding. To keep the previous behaviour, pin
;   fastembed to 0.5.1 or use `add_custom_model`.
;
; Matched on that message alone, so every other warning still surfaces. `once`
; was tried first and does nothing here: pytest gives each test a fresh warnings
; context, so "once" means once per test, not once per run.
[pytest]
filterwarnings =
    ignore:.*mean pooling instead of CLS embedding.*:UserWarning
