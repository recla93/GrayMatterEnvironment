[project]
name = "neurag"
version = "0.2.0"
description = "Standalone MCP RAG server: hierarchical knowledge graph on Turso/SQLite with pluggable embeddings"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial License 1.0.0" }
authors = [{ name = "Claudio C." }]
keywords = ["mcp", "rag", "knowledge-base", "vector-search", "turso"]

dependencies = [
    "mcp>=1.28.0,<2.0",
    # Turso is mandatory (same store engine as Neuron). Pinned exactly to match
    # the prebuilt win_amd64 wheels in Neuron/vendor: there is no PyPI wheel for
    # pyturso on Windows, so a loose ">=" would silently compile from Rust. Bump
    # this together with Neuron's pin and release.yml.
    "pyturso==0.6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pdf = ["PyMuPDF>=1.24.0"]
docx = ["python-docx>=1.1.0"]
yaml = ["PyYAML>=6.0"]                  # bulk import mapping
semantic = ["fastembed>=0.5.0,<1.0"]   # optional: turns on the semantic embedder

[project.scripts]
neurag = "neurag.cli:main"
neurag-mcp = "neurag.server:main"

# Flat layout: the package IS this folder (no move needed after the rename).
[tool.setuptools]
packages = ["neurag"]

[tool.setuptools.package-dir]
neurag = "."

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
