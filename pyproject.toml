[project]
name = "neurag"
version = "0.3.0"
description = "Standalone MCP RAG server: hierarchical knowledge graph on Turso/SQLite with pluggable embeddings"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial License 1.0.0" }
authors = [{ name = "Claudio C." }]
keywords = ["mcp", "rag", "knowledge-base", "vector-search", "turso"]

dependencies = [
    "mcp>=1.28.0,<2.0",
    # NIENTE pyturso qui (decisione 2026-07-20): db.py è progettato a 3 tier
    # (turso → sqlite3 → lessicale) e un pin hard lo contraddiceva — su un
    # checkout Windows senza le wheel vendored (che vivono in Neuron/vendor,
    # fonte unica) l'install COMPILAVA da Rust e falliva. Ora l'install base
    # funziona ovunque sul tier sqlite3; il tier turso si attiva con l'extra
    # [turso] — l'installer canonico lo tenta best-effort dal vendor/PyPI.
]

[project.optional-dependencies]
# Pin esatto = stesso motivo di Neuron: match con le wheel win_amd64 vendored.
# Bump insieme al pin di Neuron e a release.yml.
turso = ["pyturso==0.6.1"]
dev = ["pytest>=8.0"]
pdf = ["PyMuPDF>=1.24.0"]
docx = ["python-docx>=1.1.0"]
yaml = ["PyYAML>=6.0"]                  # bulk import mapping
semantic = ["fastembed>=0.5.0,<1.0"]   # optional: turns on the semantic embedder

[project.scripts]
neurag = "neurag.cli:main"
neurag-mcp = "neurag.server:main"

# Flat layout: the package IS this folder (no move needed after the rename).
[tool.setuptools]
packages = ["neurag"]

[tool.setuptools.package-dir]
neurag = "."

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
