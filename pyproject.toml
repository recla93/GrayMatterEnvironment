[project]
name = "gray-matter"
version = "1.3.0"
description = "Gray-Matter: MCP orchestrator/proxy that fronts Neuron + NeuRAG"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial License 1.0.0" }
authors = [{ name = "Claudio C." }]
keywords = ["mcp", "orchestrator", "proxy"]

dependencies = [
    "mcp>=1.28.0,<2.0",
]

[project.optional-dependencies]
cloud = ["libsql-client>=0.3.1"]
dev = ["pytest>=8.0"]
gui = ["pywebview>=5.0"]
rag = ["neurag"]

[project.scripts]
gray-matter = "gray_matter.cli:main"
gray-matter-mcp = "gray_matter.server:main"

[project.gui-scripts]
gray-matter-gui = "gray_matter.webgui:main"

# Flat layout: the package IS this folder.
[tool.setuptools]
packages = ["gray_matter"]
include-package-data = true

[tool.setuptools.package-data]
# assets/ ships too. It did not, and both symptoms came from that one line:
# the header logo (`/logo.png` reads `<package>/assets/GM.png`) and the desktop
# shortcut icon (`shortcut._resolve_icon` reads `<package>/assets/gray-matter.ico`)
# both resolve inside the INSTALLED package, where the folder did not exist —
# so the control center never showed its logo and the shortcut always fell back
# to the bare interpreter icon. `include-package-data` does not catch these on a
# flat layout without a MANIFEST.in, so they are listed explicitly.
gray_matter = ["webgui.html", "assets/*"]

[tool.setuptools.package-dir]
gray_matter = "."

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
