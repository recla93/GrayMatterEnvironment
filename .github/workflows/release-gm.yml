name: Release

# Builds the Gray-Matter package and publishes a GitHub Release with all
# artifacts attached. Runs on version tags only: pushing v* IS the release.
# (Neuron builds the Windows pyturso wheels here too because PyPI has no
# win_amd64 wheel; Gray-Matter depends only on mcp, so it needs no vendored
# wheels — a plain `python -m build` covers the artifacts.)
on:
  push:
    # Il prefisso deve essere il nome della cartella: mirror.yml riconosce il
    # tag confrontandolo col prefix del subtree (gray_matter), quindi un gm-v*
    # pubblicava la Release qui e NON mirrorava il tag — uscendo verde.
    tags: ["gray_matter-v*"]

permissions:
  contents: write

jobs:
  # --- 0. The gate ---------------------------------------------------------
  # A tag used to go straight to publish. The suite existed, the stale-release
  # guard existed and was RED, and v1.3.0 shipped anyway with the vendored
  # wheels two versions behind. A guard nothing runs is a comment.
  # Un checkout solo: i sibling sono gia' nell'albero. Erano tre perche' i tre
  # repo erano separati, e li' la CI doveva ricomporli a mano — con il rischio,
  # visto davvero, di prenderli dal branch sbagliato.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e ./gray_matter[dev]
          pip install -e ./neuron
          pip install -e ./neurag
      - run: python -m pytest gray_matter/tests -q

  build-release:
    needs: test                        # red tests, no release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gray_matter
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth 0: l'ultimo step fa `git subtree split`, che deve
          # risalire tutta la storia. persist-credentials false: checkout
          # lascerebbe in git config un extraheader col GITHUB_TOKEN, che vince
          # sulle credenziali scritte nell'URL -- il push del tag partirebbe
          # come github-actions[bot], che sui mirror non ha nessun permesso.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build           # dist/*.whl + dist/*.tar.gz
      - run: python -m pip install dist/*.whl && python -c "import gray_matter; print(gray_matter.__version__)"
      - uses: softprops/action-gh-release@v2
        with:
          files: gray_matter/dist/*                # gray-matter wheel + sdist
          generate_release_notes: true

      # Il tag arriva sul mirror SOLO ORA, a Release pubblicata. Finche' e'
      # stato in mirror.yml partiva in parallelo al gate: neuron-v6.4.3 e'
      # finito come v6.4.3 su Neuron mentre il Release falliva, lasciando
      # pubblico un tag che non corrispondeva a nessuna release.
      #
      # Qui il mirror NON e' una proiezione letterale: i tag sono prefissati
      # (`gray_matter-v1.2.3`) perche' un `v*` nudo farebbe scattare tutti e tre i
      # release insieme; di la' deve arrivare `v1.2.3`, o la pagina Releases di
      # quel repo smette di avere senso.
      - name: Tag sul mirror, rinominato
        working-directory: .
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -eu
          if [ -z "${TOKEN:-}" ]; then echo "  MIRROR_TOKEN assente: niente tag"; exit 0; fi
          TAG="${GITHUB_REF#refs/tags/}"
          SHA=$(git subtree split --prefix=gray_matter)
          OUT="v${TAG#gray_matter-v}"
          echo "  $TAG -> recla93/gray-matter come $OUT ($SHA)"
          URL="https://x-access-token:$TOKEN@github.com/recla93/gray-matter.git"
          git push "$URL" "$SHA:refs/tags/$OUT"
