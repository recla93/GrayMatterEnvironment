name: Release

# Builds the Gray-Matter package and publishes a GitHub Release with all
# artifacts attached. Runs on version tags only: pushing v* IS the release.
# (Neuron builds the Windows pyturso wheels here too because PyPI has no
# win_amd64 wheel; Gray-Matter depends only on mcp, so it needs no vendored
# wheels — a plain `python -m build` covers the artifacts.)
on:
  push:
    # Il prefisso deve essere il nome della cartella: mirror.yml riconosce il
    # tag confrontandolo col prefix del subtree (gray_matter), quindi un gm-v*
    # pubblicava la Release qui e NON mirrorava il tag — uscendo verde.
    tags: ["gray_matter-v*"]

permissions:
  contents: write

jobs:
  # --- 0. The gate ---------------------------------------------------------
  # A tag used to go straight to publish. The suite existed, the stale-release
  # guard existed and was RED, and v1.3.0 shipped anyway with the vendored
  # wheels two versions behind. A guard nothing runs is a comment.
  # Un checkout solo: i sibling sono gia' nell'albero. Erano tre perche' i tre
  # repo erano separati, e li' la CI doveva ricomporli a mano — con il rischio,
  # visto davvero, di prenderli dal branch sbagliato.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e ./gray_matter[dev]
          pip install -e ./neuron
          pip install -e ./neurag
      - run: python -m pytest gray_matter/tests -q

  build-release:
    needs: test                        # red tests, no release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gray_matter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build           # dist/*.whl + dist/*.tar.gz
      - run: python -m pip install dist/*.whl && python -c "import gray_matter; print(gray_matter.__version__)"
      - uses: softprops/action-gh-release@v2
        with:
          files: gray_matter/dist/*                # gray-matter wheel + sdist
          generate_release_notes: true
