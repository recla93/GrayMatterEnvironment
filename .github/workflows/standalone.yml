name: Standalone

# I DUE PEER DEVONO FUNZIONARE SENZA GRAY MATTER.
#
# Il contratto e' retto da ~60 `try/except ImportError` scritti a mano nel
# codice di neuron e neurag. Prima del monorepo qualcosa lo verificava per
# ACCIDENTE: la CI di Neuron faceva un checkout solo e `pip install -e .[dev]`,
# quindi girava in un venv dove `gray_matter` non esisteva e un import non
# protetto esplodeva li'.
#
# Il monorepo cancella quell'accidente: la CI naturale installa tutti e tre, e
# in quel venv un import non protetto passa liscio. Anche sulla macchina di chi
# sviluppa, dove GM c'e' sempre. La regressione si manifesterebbe solo a casa di
# un utente standalone, mesi dopo, con un ModuleNotFoundError all'avvio.
#
# Quindi il guard torna, ma dichiarato invece che ereditato: un venv per peer,
# con QUEL peer soltanto.

on: [push, pull_request]

jobs:
  alone:
    name: ${{ matrix.tool }} senza Gray Matter
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [neuron, neurag]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache fastembed ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-all-MiniLM-L6-v2-v1

      # Un solo tool, e nient'altro. Nessun `-e ./gray_matter`, per nessun
      # motivo: e' l'intero punto del job.
      # IL TOOL VA COPIATO FUORI DALL'ALBERO, SENZA FRATELLI.
      # Dentro il monorepo non c'e' modo di essere soli: la radice contiene
      # `gray_matter/` e `neurag/`, che sono pacchetti a layout piatto, quindi
      # basta che QUALCUNO la metta in sys.path perche' si importino tutti.
      # Misurato: `tests/test_bench_set.py` inserisce `parent.parent.parent`
      # (nei tre repo separati era la cartella sopra il repo, qui e' la radice),
      # viene raccolto prima in ordine alfabetico, e da li' in poi
      # `importorskip("gray_matter")` riesce -- il job passava con 378 test
      # invece dei 289 + 4 skip di un ambiente davvero senza gateway.
      # Una copia in RUNNER_TEMP non ha fratelli, e nessun `parents[N]` puo'
      # inventarli: vale anche per gli inserimenti che nessuno ha ancora scritto.
      - name: ${{ matrix.tool }} da solo, fuori dall'albero
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/solo"
          cp -r "$GITHUB_WORKSPACE/${{ matrix.tool }}" "$RUNNER_TEMP/solo/"
          echo "  vicini di casa:"; ls "$RUNNER_TEMP/solo"
      - name: Install ONLY ${{ matrix.tool }}
        working-directory: ${{ runner.temp }}/solo/${{ matrix.tool }}
        run: pip install -e .[dev]

      - name: Gray Matter non deve essere qui
        shell: bash
        working-directory: ${{ runner.temp }}/solo/${{ matrix.tool }}
        run: |
          if python -c "import gray_matter" 2>/dev/null; then
            echo "::error::gray_matter e' importabile: il job non prova piu' niente"
            exit 1
          fi
          echo "  ok: gray_matter assente"

      # I moduli del prodotto, importati uno per uno. Il grosso del contratto
      # sta qui: un import non protetto muore su questa riga, non fra sei mesi.
      - name: Import di ogni modulo del prodotto
        working-directory: ${{ runner.temp }}/solo/${{ matrix.tool }}
        run: python -c "import importlib,pkgutil,${{ matrix.tool }} as p; [importlib.import_module(m.name) for m in pkgutil.walk_packages(p.__path__, p.__name__ + '.')]"

      # Niente --confcutdir: sopra la copia non c'e' piu' nessun conftest.py
      # ne' pytest.ini da tagliare. La rootdir e' il tool, come per chi ha
      # clonato solo questo repo.
      - name: Run tests
        working-directory: ${{ runner.temp }}/solo/${{ matrix.tool }}
        run: python -m pytest tests -q
