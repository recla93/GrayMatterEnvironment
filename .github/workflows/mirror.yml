name: Mirror

# I TRE REPO PUBBLICI SONO PROIEZIONI, NON GEMELLI.
#
# Qui si committa; loro seguono. `git subtree split` non fabbrica copie: per la
# storia importata ricostruisce ESATTAMENTE i commit originali (verificato: lo
# split di neuron/ ha restituito lo stesso SHA di master), e per i commit nuovi
# produce discendenti diretti. Quindi il push e' un fast-forward normale —
# niente --force, niente SHA riscritti, i tag gia' pubblicati restano validi.
#
# Un commit che tocca due tool insieme si divide da solo: nel mirror di neuron
# arriva la sola parte di neuron.
#
# REGOLA: non si committa sui mirror. Proteggerli "lasciando scrivere solo il
# token di questo workflow" NON e' possibile, ed e' stato verificato: MIRROR_TOKEN
# e' un PAT del proprietario, quindi GitHub vede la stessa identita' delle sue
# mani e nessuna regola puo' separarle. Il ruleset la' vieta invece cio' che il
# mirror non fa mai -- force push e cancellazione di `main` -- con bypass vuota:
# il mirror e' sempre fast-forward e passa, una divergenza si ferma. Il divieto
# di committare a mano vive in locale, non su GitHub:
#     git remote set-url --push origin DISABLED
# Due copie che possono divergere sono la trappola che questo repo esiste per
# chiudere.
#
# Tutti e tre i mirror hanno `main` come default. Non e' un dettaglio estetico:
# la prima passata a vuoto pushava su `refs/heads/main` mentre Neuron stava su
# `master`, e invece di aggiornare il mirror creava un branch nuovo — un push
# riuscito che non aggiornava niente. Un nome solo, nessun caso particolare.

# I TAG NON SONO PIU' QUI. Partivano in parallelo al gate di release, quindi
# una release fallita lasciava comunque il tag sul repo pubblico: neuron-v6.4.3
# e' finito come v6.4.3 su Neuron mentre il Release moriva sui test. Ora il push
# del tag e' l'ultimo step di release-*.yml, a pubblicazione avvenuta.
on:
  push:
    branches: [main]

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  push-mirrors:
    runs-on: ubuntu-latest
    strategy:
      # Un mirror in errore non deve cancellare gli altri due: con fail-fast
      # attivo la riga rossa non dice piu' QUALE repo ha il problema.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - prefix: neuron
            repo: recla93/Neuron
          - prefix: neurag
            repo: recla93/NeuRAG
          - prefix: gray_matter
            repo: recla93/gray-matter
    steps:
      # subtree split deve poter risalire tutta la storia: senza fetch-depth 0
      # ricostruirebbe da un albero tronco e il push non sarebbe fast-forward.
      #
      # persist-credentials: false perche' checkout lascia in git config un
      # http.https://github.com/.extraheader col GITHUB_TOKEN, e quell'header
      # vince sulle credenziali scritte nell'URL di push: il PAT non veniva mai
      # usato e i tre push partivano come github-actions[bot], che la' non ha
      # nessun permesso. Un 403 che sembrava un secret sbagliato e non lo era.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Split e push del branch
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -eu
          # Finche' il PAT non esiste, il mirror non e' un errore: e' un passo
          # che non tocca a questo repo. Senza questa riga ogni push su main
          # lascerebbe una X rossa che non dice niente a nessuno.
          if [ -z "${TOKEN:-}" ]; then echo "  MIRROR_TOKEN assente: niente mirror"; exit 0; fi
          SHA=$(git subtree split --prefix=${{ matrix.prefix }})
          echo "  ${{ matrix.prefix }} -> $SHA"
          git push "https://x-access-token:$TOKEN@github.com/${{ matrix.repo }}.git" \
            "$SHA:refs/heads/main"
