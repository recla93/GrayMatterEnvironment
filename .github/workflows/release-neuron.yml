name: Release

# Builds the Windows pyturso wheels (no win_amd64 on PyPI, so we compile them on
# a GitHub runner that already has Rust + MSVC + Windows SDK), builds the Neuron
# package, and publishes a GitHub Release with all artifacts attached.
#
# Python matrix includes 3.14: a team member runs Neuron on 3.14 and the wheel
# pyturso-0.6.1-cp314-cp314-win_amd64.whl is vendored manually — this job keeps
# it regenerated automatically on every release / pyturso bump.
on:
  push:
    tags: ["neuron-v*"]

permissions:
  contents: write

jobs:
  # --- 0. The gate ---------------------------------------------------------
  # ci.yml already runs this suite on every push, but a TAG could still publish
  # with it red: nothing connected the two. Now it does. Compiling five pyturso
  # wheels before knowing whether the code works was the wrong order anyway.
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: neuron
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-all-MiniLM-L6-v2-v1
      - run: pip install -e .[dev]
      - run: python -m pytest tests/ -q

      # The bootstrap in install.ps1/install.sh clones `v$GM_VERSION` of a
      # DIFFERENT repo when no local Gray Matter is found. Nothing kept that
      # constant in sync: it sat at 1.1.2 while GM shipped 1.4.0, so a user
      # without a local GM got a three-releases-old gateway paired with a
      # current Neuron — exactly the venv skew the pip check in GM's installer
      # now reports. A release cannot ship that silently any more.
      - name: GM_VERSION combacia con Gray Matter in questo albero
        shell: bash
        working-directory: .
        run: |
          set -eu
          ps1=$(sed -n 's/^\$GmVersion = .*else { "\(.*\)" }.*/\1/p' neuron/install.ps1)
          sh=$(sed -n 's/^GM_VERSION="\${GM_VERSION:-\(.*\)}"/\1/p' neuron/install.sh)
          gm=$(sed -n 's/^version *= *"\(.*\)".*/\1/p' gray_matter/pyproject.toml | head -1)
          echo "install.ps1=$ps1  install.sh=$sh  gray_matter/pyproject.toml=$gm"
          [ "$ps1" = "$sh" ] || { echo "::error::install.ps1 ($ps1) e install.sh ($sh) non concordano su GM_VERSION"; exit 1; }
          [ "$ps1" = "$gm" ] || { echo "::error::GM_VERSION e' $ps1 ma Gray Matter in questo albero e' $gm"; exit 1; }
  # --- 1. Compile pyturso for Windows (no win_amd64 on PyPI → we build it) ---
  build-pyturso-win:
    needs: test                        # red tests, no release
    runs-on: windows-latest          # already has Rust + MSVC + Windows SDK
    # NIENTE working-directory qui, e nessun checkout: questo job compila
    # pyturso da PyPI e non tocca un solo file del repo. Col working-directory
    # ereditato dagli altri job alla migrazione nel contenitore, ogni run
    # moriva prima di partire -- "the directory name is invalid" -- perche' la
    # cartella non esiste su un runner senza checkout. wheelhouse/ nasce nella
    # radice del workspace, dove upload-artifact la cerca gia'.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          allow-prereleases: true    # 3.14 may still be pre-release on the runner
      - run: pip wheel "pyturso==0.6.1" --no-deps -w wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: pyturso-win-${{ matrix.python }}
          path: wheelhouse/*.whl

  # --- 2. Build the Neuron package + 3. Publish the Release ---
  build-release:
    needs: build-pyturso-win
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuron
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth 0: l'ultimo step fa `git subtree split`, che deve
          # risalire tutta la storia. persist-credentials false: checkout
          # lascerebbe in git config un extraheader col GITHUB_TOKEN, che vince
          # sulle credenziali scritte nell'URL -- il push del tag partirebbe
          # come github-actions[bot], che sui mirror non ha nessun permesso.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build           # dist/*.whl + dist/*.tar.gz
      - run: python -m pip install dist/*.whl && python -c "import neuron; print(neuron.__version__)"
      - uses: actions/download-artifact@v4
        with:
          pattern: pyturso-win-*
          # Il path di download-artifact e' relativo alla RADICE del workspace:
          # defaults.run.working-directory vale solo per gli step `run`. Con
          # `path: dist` le wheel finivano in dist/ mentre `python -m build` --
          # che il working-directory lo rispetta -- scriveva in neuron/dist/,
          # ed e' li' che guarda il glob dei files. La Release usciva verde con
          # solo wheel e sdist, senza le cinque pyturso: proprio gli artefatti
          # per cui il matrix Windows esiste.
          path: neuron/dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: neuron/dist/*                # neuron wheel + sdist + pyturso win wheels
          generate_release_notes: true

      # Il tag arriva sul mirror SOLO ORA, a Release pubblicata. Finche' e'
      # stato in mirror.yml partiva in parallelo al gate: neuron-v6.4.3 e'
      # finito come v6.4.3 su Neuron mentre il Release falliva, lasciando
      # pubblico un tag che non corrispondeva a nessuna release.
      #
      # Qui il mirror NON e' una proiezione letterale: i tag sono prefissati
      # (`neuron-v1.2.3`) perche' un `v*` nudo farebbe scattare tutti e tre i
      # release insieme; di la' deve arrivare `v1.2.3`, o la pagina Releases di
      # quel repo smette di avere senso.
      - name: Tag sul mirror, rinominato
        working-directory: .
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -eu
          if [ -z "${TOKEN:-}" ]; then echo "  MIRROR_TOKEN assente: niente tag"; exit 0; fi
          TAG="${GITHUB_REF#refs/tags/}"
          SHA=$(git subtree split --prefix=neuron)
          OUT="v${TAG#neuron-v}"
          echo "  $TAG -> recla93/Neuron come $OUT ($SHA)"
          URL="https://x-access-token:$TOKEN@github.com/recla93/Neuron.git"
          git push "$URL" "$SHA:refs/tags/$OUT"
