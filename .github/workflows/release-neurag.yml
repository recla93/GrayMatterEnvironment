name: Release

# Builds the NeuRAG package and publishes a GitHub Release with the wheel,
# the sdist and the Windows pyturso wheel attached.
#
# The pyturso wheel is the one vendored in neurag/vendor/ (PyPI has no
# win_amd64 wheel): the same file install.ps1 installs, so the Release and a
# user's install cannot diverge. It is no longer compiled here: on 2026-11-18
# a newer rustc on the runner stopped compiling turso_core 0.8.3 (E0308), and
# the release would have died on a change outside this repo. A pyturso bump
# rebuilds the wheel by hand (neurag/vendor/README.md); the guard below fails
# the release when the pin and the vendored wheel disagree.
on:
  push:
    tags: ["neurag-v*"]

permissions:
  contents: write

jobs:
  # --- 0. The gate ---------------------------------------------------------
  # A tag used to publish without asking the 369 tests anything.
  # Un checkout solo: i sibling sono gia' nell'albero. Erano tre perche' i tre
  # repo erano separati, e li' il job doveva ricomporli clonandoli da GitHub --
  # cosa che qui avrebbe provato il loro `main` invece dell'albero che si sta
  # per taggare, e con `path: neurag` avrebbe anche annidato il repo in se'.
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: neurag
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-all-MiniLM-L6-v2-v1
      - working-directory: .
        run: |
          pip install -e ./neurag[dev]
          pip install -e ./neuron
          pip install -e ./gray_matter
      - run: python -m pytest tests/ -q

      # Il bootstrap in install.ps1/install.sh scarica `v$GM_VERSION` di un ALTRO
      # repo quando GM non e' in locale. Niente teneva allineata quella costante:
      # in Neuron era rimasta a 1.1.2 mentre GM era a 1.4.0, e qui era identica.
      # Una release non puo' piu' spedirla stantia in silenzio.
      - name: GM_VERSION combacia con Gray Matter in questo albero
        shell: bash
        working-directory: .
        run: |
          set -eu
          ps1=$(sed -n 's/^\$GmVersion = .*else { "\(.*\)" }.*/\1/p' neurag/install.ps1)
          sh=$(sed -n 's/^GM_VERSION="\${GM_VERSION:-\(.*\)}"/\1/p' neurag/install.sh)
          gm=$(sed -n 's/^version *= *"\(.*\)".*/\1/p' gray_matter/pyproject.toml | head -1)
          echo "install.ps1=$ps1  install.sh=$sh  gray_matter/pyproject.toml=$gm"
          [ "$ps1" = "$sh" ] || { echo "::error::install.ps1 ($ps1) e install.sh ($sh) non concordano su GM_VERSION"; exit 1; }
          [ "$ps1" = "$gm" ] || { echo "::error::GM_VERSION e' $ps1 ma Gray Matter in questo albero e' $gm"; exit 1; }
  # --- 2. Build the NeuRAG package + 3. Publish the Release ---
  build-release:
    needs: test                        # red tests, no release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neurag
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth 0: l'ultimo step fa `git subtree split`, che deve
          # risalire tutta la storia. persist-credentials false: checkout
          # lascerebbe in git config un extraheader col GITHUB_TOKEN, che vince
          # sulle credenziali scritte nell'URL -- il push del tag partirebbe
          # come github-actions[bot], che sui mirror non ha nessun permesso.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build           # dist/*.whl + dist/*.tar.gz
      - run: python -m pip install dist/*.whl && python -c "import neurag; print(neurag.__version__)"
      - name: Attach the vendored pyturso wheel (pin and wheel must agree)
        shell: bash
        run: |
          set -eu
          pin=$(grep -o 'pyturso==[0-9.]*' pyproject.toml | head -1 | cut -d= -f3)
          whl=$(ls vendor/pyturso-*-win_amd64.whl)
          echo "pin=$pin  vendored=$whl"
          case "$whl" in vendor/pyturso-$pin-*) ;; *)
            echo "::error::pyproject pins pyturso==$pin but vendor/ holds $whl: rebuild it (vendor/README.md)"; exit 1;;
          esac
          cp vendor/pyturso-*-win_amd64.whl dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: neurag/dist/*                # neurag wheel + sdist + the vendored pyturso win wheel
          generate_release_notes: true

      # Il tag arriva sul mirror SOLO ORA, a Release pubblicata. Finche' e'
      # stato in mirror.yml partiva in parallelo al gate: neuron-v6.4.3 e'
      # finito come v6.4.3 su Neuron mentre il Release falliva, lasciando
      # pubblico un tag che non corrispondeva a nessuna release.
      #
      # Qui il mirror NON e' una proiezione letterale: i tag sono prefissati
      # (`neurag-v1.2.3`) perche' un `v*` nudo farebbe scattare tutti e tre i
      # release insieme; di la' deve arrivare `v1.2.3`, o la pagina Releases di
      # quel repo smette di avere senso.
      - name: Tag sul mirror, rinominato
        id: mirror
        working-directory: .
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -eu
          if [ -z "${TOKEN:-}" ]; then echo "  MIRROR_TOKEN assente: niente tag"; exit 0; fi
          TAG="${GITHUB_REF#refs/tags/}"
          SHA=$(git subtree split --prefix=neurag)
          OUT="v${TAG#neurag-v}"
          echo "  $TAG -> recla93/NeuRAG come $OUT ($SHA)"
          URL="https://x-access-token:$TOKEN@github.com/recla93/NeuRAG.git"
          git push "$URL" "$SHA:refs/tags/$OUT"
          echo "tag=$OUT" >> "$GITHUB_OUTPUT"

      # La Release sul mirror, non solo il tag. Senza questo passo la pagina
      # Releases di recla93/NeuRAG restava ferma all'ultima release fatta a mano
      # (agosto) mentre i tag avanzavano: chi apriva quel repo vedeva "Latest
      # vX" con il codice tre versioni avanti. Stessi artefatti del Release
      # qui sopra; le note le genera GitHub dalla storia del mirror.
      - name: Release sul mirror
        if: steps.mirror.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: recla93/NeuRAG
          token: ${{ secrets.MIRROR_TOKEN }}
          tag_name: ${{ steps.mirror.outputs.tag }}
          files: neurag/dist/*
          generate_release_notes: true
          make_latest: true
