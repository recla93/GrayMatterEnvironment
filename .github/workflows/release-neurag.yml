name: Release

# Builds the Windows pyturso wheels (no win_amd64 on PyPI, so we compile them on
# a GitHub runner that already has Rust + MSVC + Windows SDK), builds the NeuRAG
# package, and publishes a GitHub Release with all artifacts attached.
#
# NeuRAG vendors its OWN pyturso wheels (Neurag/vendor/) so it installs the Turso
# tier with no compiler even when Neuron is not present — the environments are
# decoupled. This job keeps that vendored set regenerated on every release /
# pyturso bump. Keep the pin in sync with the [turso] extra in pyproject.toml.
on:
  push:
    tags: ["neurag-v*"]

permissions:
  contents: write

jobs:
  # --- 0. The gate ---------------------------------------------------------
  # A tag used to publish without asking the 369 tests anything.
  # Un checkout solo: i sibling sono gia' nell'albero. Erano tre perche' i tre
  # repo erano separati, e li' il job doveva ricomporli clonandoli da GitHub --
  # cosa che qui avrebbe provato il loro `main` invece dell'albero che si sta
  # per taggare, e con `path: neurag` avrebbe anche annidato il repo in se'.
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: neurag
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-all-MiniLM-L6-v2-v1
      - working-directory: .
        run: |
          pip install -e ./neurag[dev]
          pip install -e ./neuron
          pip install -e ./gray_matter
      - run: python -m pytest tests/ -q

      # Il bootstrap in install.ps1/install.sh scarica `v$GM_VERSION` di un ALTRO
      # repo quando GM non e' in locale. Niente teneva allineata quella costante:
      # in Neuron era rimasta a 1.1.2 mentre GM era a 1.4.0, e qui era identica.
      # Una release non puo' piu' spedirla stantia in silenzio.
      - name: GM_VERSION combacia con Gray Matter in questo albero
        shell: bash
        working-directory: .
        run: |
          set -eu
          ps1=$(sed -n 's/^\$GmVersion = .*else { "\(.*\)" }.*/\1/p' neurag/install.ps1)
          sh=$(sed -n 's/^GM_VERSION="\${GM_VERSION:-\(.*\)}"/\1/p' neurag/install.sh)
          gm=$(sed -n 's/^version *= *"\(.*\)".*/\1/p' gray_matter/pyproject.toml | head -1)
          echo "install.ps1=$ps1  install.sh=$sh  gray_matter/pyproject.toml=$gm"
          [ "$ps1" = "$sh" ] || { echo "::error::install.ps1 ($ps1) e install.sh ($sh) non concordano su GM_VERSION"; exit 1; }
          [ "$ps1" = "$gm" ] || { echo "::error::GM_VERSION e' $ps1 ma Gray Matter in questo albero e' $gm"; exit 1; }
  # --- 1. Compile pyturso for Windows (no win_amd64 on PyPI → we build it) ---
  build-pyturso-win:
    needs: test                      # red tests, no release
    runs-on: windows-latest          # already has Rust + MSVC + Windows SDK
    # NIENTE working-directory qui, e nessun checkout: questo job compila
    # pyturso da PyPI e non tocca un solo file del repo. Col working-directory
    # ereditato dagli altri job alla migrazione nel contenitore, ogni run
    # moriva prima di partire -- "the directory name is invalid" -- perche' la
    # cartella non esiste su un runner senza checkout. wheelhouse/ nasce nella
    # radice del workspace, dove upload-artifact la cerca gia'.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          allow-prereleases: true    # 3.14 may still be pre-release on the runner
      - run: pip wheel "pyturso==0.6.1" --no-deps -w wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: pyturso-win-${{ matrix.python }}
          path: wheelhouse/*.whl

  # --- 2. Build the NeuRAG package + 3. Publish the Release ---
  build-release:
    needs: build-pyturso-win
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neurag
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build           # dist/*.whl + dist/*.tar.gz
      - run: python -m pip install dist/*.whl && python -c "import neurag; print(neurag.__version__)"
      - uses: actions/download-artifact@v4
        with:
          pattern: pyturso-win-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: neurag/dist/*                # neurag wheel + sdist + pyturso win wheels
          generate_release_notes: true
