name: CI

# NeuRAG had no CI at all until 2026-08-03: 369 tests that no automation ever
# ran, and a release workflow that published on a tag without asking any of
# them. See gray_matter/.github/workflows/ci.yml for the incident this pair of
# files exists to prevent.
#
# WHY THREE CHECKOUTS
# `test_standalone_invariant` runs NeuRAG from the parent directory to prove it
# loads with NO peer present (the I2 invariant), and a few tests import neuron /
# gray_matter inside the test body. Both need the siblings laid out as they are
# on a developer machine:
#
#     <workspace>/neurag   <workspace>/neuron   <workspace>/gray_matter
#
# All three are installed here, unlike in Gray Matter's CI, because these tests
# import the peers rather than only reading their files.

on: [push, pull_request]

jobs:
  check:
    runs-on: windows-latest
    steps:
      # Un cambiamento puo' attraversare i tre repo (l'handshake vive in tutti
      # e tre): presi sempre dal loro DEFAULT, i sibling fanno confrontare al
      # guard una meta' nuova e una meta' vecchia, e una modifica coerente
      # risulta rossa. Se esiste un branch omonimo di la', si prova quello.
      # Ref vuoto = branch di default, cioe' il comportamento di prima.
      - name: Resolve the sibling ref
        id: peers
        shell: bash
        run: |
          BR="${{ github.head_ref || github.ref_name }}"
          resolve() {   # $1 = repo su GitHub, $2 = chiave di output
            if git ls-remote --exit-code --heads "https://github.com/recla93/$1.git" "$BR" >/dev/null 2>&1; then
              echo "$2=$BR" >> "$GITHUB_OUTPUT"; echo "  $1 -> $BR"
            else
              echo "$2=" >> "$GITHUB_OUTPUT"; echo "  $1 -> (default)"
            fi
          }
          resolve Neuron neuron
          resolve gray-matter gray_matter

      - uses: actions/checkout@v4
        with:
          path: neurag

      - uses: actions/checkout@v4
        with:
          repository: recla93/Neuron
          ref: ${{ steps.peers.outputs.neuron }}
          path: neuron

      - uses: actions/checkout@v4
        with:
          repository: recla93/gray-matter
          ref: ${{ steps.peers.outputs.gray_matter }}
          path: gray_matter

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the suite
        run: |
          pip install -e ./neurag[dev]
          pip install -e ./neuron
          pip install -e ./gray_matter

      - name: Check syntax
        working-directory: neurag
        run: python -m compileall .

      - name: Run tests
        working-directory: neurag
        run: python -m pytest tests/ -v
